version: "2"
linters:
  enable:
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    # - unparam
    - whitespace
    # - wrapcheck
  disable:
    - errcheck
    - ineffassign
    - unused
  settings:
    revive:
      # Exactly one rule: the operator's file-size limit. A non-empty
      # `rules` list REPLACES revive's default rule set (verified against
      # golangci-lint v2.13.1 pkg/golinters/revive: the settings are
      # decoded into a fresh lint.Config and defaults are only re-added
      # for enable-all-rules/enable-default-rules), so enabling revive
      # here adds no other revive rule.
      # skipComments/skipBlankLines must stay false: the count must stay
      # the raw line count that .githooks/check_file_size.sh ratchets on
      # -- that agreement is what makes
      # .githooks/file_size_allowlist.txt the single source of truth for
      # both layers.
      rules:
        - name: file-length-limit
          arguments:
            - max: 1000
              skipComments: false
              skipBlankLines: false
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # interp.ExecHandler is deprecated in favor of interp.ExecHandlers, but
      # the latter always appends interp.DefaultExecHandler as the final
      # handler, which lacks the process-group isolation this fork relies on
      # (see internal/shell/run.go's execHandlerOption doc comment). The
      # deprecated call is intentional. Excluded here instead of via an
      # inline //nolint because staticcheck's SA1019 report for this line is
      # not reproduced consistently across OS runners, which made
      # nolintlint flag the inline directive as "unused" on some platforms.
      - path: internal/shell/run\.go
        linters:
          - staticcheck
        text: "SA1019"
      # SA2001 "empty critical section": lock-then-immediately-unlock is not
      # dead code in these files, it is the idiom being used on purpose.
      # In the mcp tests it is a barrier -- take the lease, so the goroutine
      # blocks until whoever holds it releases, then proceed -- and in
      # state_regression_refresh_test.go it is a 500-iteration churn loop
      # stressing lease reclamation. In contextlock_alloc_test.go the
      # lock/unlock pair IS the operation whose allocations
      # testing.AllocsPerRun measures; removing it would delete the test.
      - path: internal/agent/tools/mcp/.*_test\.go
        linters:
          - staticcheck
        text: "SA2001"
      # The MCP SDK detaches its connection context from Connect's context,
      # so this transport keeps the pre-context cancellation path as an
      # explicit fence for a request blocked before it has produced a
      # response body -- context cancellation alone is not sufficient on
      # every Windows net/http path. See the comment at the call site.
      - path: internal/agent/tools/mcp/transport\.go
        linters:
          - staticcheck
        text: "SA1019"
      # QF* are staticcheck's optional "quickfix" suggestions, not
      # correctness findings. QF1001 in particular rewrites guard conditions
      # through De Morgan's law; the identity guards in the MCP package are
      # deliberately written in the positive form (owner != o && !o.standalone)
      # so that the standalone relaxation reads as one clause, and inverting
      # them would obscure exactly the thing reviewers need to see.
      - linters:
          - staticcheck
        text: "QF1001"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
