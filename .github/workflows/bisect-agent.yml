name: bisect-agent
# Temporary, disposable workflow for binary-searching the chronic
# ubuntu-latest kill in build.yml's go-test step down to a specific
# test/file in internal/agent. workflow_dispatch only -- fired manually
# via `gh workflow run` with a -run/-skip regex, no code commit needed
# per round. Delete this file once the root cause is isolated and fixed.
on:
  workflow_dispatch:
    inputs:
      run_pattern:
        description: "go test -run regex (empty = run everything)"
        required: false
        default: ""
      skip_pattern:
        description: "go test -skip regex (empty = skip nothing)"
        required: false
        default: ""
      run_files:
        description: "space-separated internal/agent/*_test.go filenames to derive a -run regex from (avoids huge regex literals in dispatch inputs)"
        required: false
        default: ""
      skip_files:
        description: "space-separated internal/agent/*_test.go filenames to derive a -skip regex from"
        required: false
        default: ""
      label:
        description: "free-text label for this round, shown in the log"
        required: false
        default: "unlabeled"

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: run isolated internal/agent subset
        shell: bash
        env:
          RUN_PATTERN: ${{ inputs.run_pattern }}
          SKIP_PATTERN: ${{ inputs.skip_pattern }}
          RUN_FILES: ${{ inputs.run_files }}
          SKIP_FILES: ${{ inputs.skip_files }}
          LABEL: ${{ inputs.label }}
        run: |
          set -uo pipefail
          # names_from_files: extract top-level `func TestX` names from the
          # given internal/agent/*_test.go filenames and join into a single
          # `^(A|B|C)$` regex -- keeps huge test lists out of the
          # workflow_dispatch input itself (which has practical size limits).
          names_from_files() {
            local files=() f
            for f in $1; do files+=("internal/agent/$f"); done
            grep -h "^func Test" "${files[@]}" \
              | sed 's/func \(Test[A-Za-z0-9_]*\).*/\1/' \
              | tr -d '\r' \
              | paste -sd'|' - \
              | sed 's/^/^(/; s/$/)$/'
          }
          args=(-short -failfast -v)
          if [ -n "$RUN_FILES" ]; then
            RUN_PATTERN="$(names_from_files "$RUN_FILES")"
          fi
          if [ -n "$SKIP_FILES" ]; then
            SKIP_PATTERN="$(names_from_files "$SKIP_FILES")"
          fi
          [ -n "${RUN_PATTERN:-}" ] && args+=(-run "$RUN_PATTERN")
          [ -n "${SKIP_PATTERN:-}" ] && args+=(-skip "$SKIP_PATTERN")
          echo "round label: $LABEL"
          echo "go test ${args[*]} ./internal/agent/"
          df -h . 2>/dev/null || true
          go test "${args[@]}" ./internal/agent/
          rc=$?
          echo "round result: rc=$rc"
          exit $rc
