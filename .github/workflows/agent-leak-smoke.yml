# Cumulative-leak smoke run for internal/agent: the whole package as ONE
# unbatched `go test` invocation, no -race, with a runtime.NumGoroutine()
# before/after comparison around the entire run.
#
# Why this exists: batching -- the test-agent job's 8-way split in
# build.yml, and the batched -race split in its test-race job -- keeps
# each invocation short enough for shared runners, but it also lowers
# the chance of catching a leak that only manifests after hundreds of
# tests have accumulated in a single process. Exactly such a leak (every
# test's db.Connect/conn.Close() pair left that DB's stdlib
# connectionOpener goroutine alive; the count climbed 21 -> 141+ inside
# one unbatched run) was found on 2026-08-30 by instrumenting one
# unbatched run of the whole package -- see
# docs/lessons/2026-08-30-ci-goroutine-leak.md. This workflow re-creates
# that measurement shape so the next such leak is caught mechanically
# instead of by another manual investigation.
#
# Why the instrumentation is generated at run time instead of committed:
# internal/agent already has a TestMain (internal/agent/agent_test.go),
# so a second one would not compile, and this is a rarely-run diagnostic,
# not a gate for every push. The step below writes a small external
# test-package file (package agent_test -- already an established pattern
# in this package) into the checkout at run time: its init() captures
# the baseline goroutine count before any test runs, and its single test
# runs after every internal-package test (a package's external test
# package always runs after its internal one) and fails with a full
# runtime.Stack(buf, true) dump if the count grew past the threshold.
# The file is deleted when the step exits and is never committed.
#
# Triggers: workflow_dispatch ONLY. The fork deliberately runs no cron
# anywhere (CLAUDE.md, "CI / hooks": all scheduled workflows were
# disabled to stop emails), and the ordinary push/PR CI must not get
# longer -- so this runs only when started manually (`gh workflow run
# agent-leak-smoke.yml` or the Actions tab "Run workflow" button).
name: agent-leak-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: one unbatched internal/agent run with a goroutine before/after check
        shell: bash
        run: |
          set -uo pipefail
          cat > internal/agent/zz_ci_leak_smoke_test.go <<'EOF'
          package agent_test

          import (
          	"fmt"
          	"runtime"
          	"testing"
          	"time"
          )

          // ciLeakSmokeBaseline holds the goroutine count before any
          // test in this binary has run. This file is generated by the
          // agent-leak-smoke workflow at run time and never committed:
          // internal/agent already has a TestMain, so the check rides
          // in an external-package init() plus one last-running test.
          var ciLeakSmokeBaseline int

          func init() {
          	runtime.GC()
          	ciLeakSmokeBaseline = runtime.NumGoroutine()
          }

          func TestCILeakSmokeGoroutineGrowth(t *testing.T) {
          	// Let timers and cleanups from the last real tests wind
          	// down before judging.
          	runtime.GC()
          	time.Sleep(2 * time.Second)
          	runtime.GC()
          	after := runtime.NumGoroutine()
          	growth := after - ciLeakSmokeBaseline
          	fmt.Printf("LEAK-SMOKE: goroutines before=%d after=%d growth=%d\n",
          		ciLeakSmokeBaseline, after, growth)
          	// Threshold: a healthy run ends within single digits of
          	// its baseline (docs/lessons/2026-08-30-ci-goroutine-leak.md:
          	// down to 9, from a leak-driven peak of 141+), while the
          	// documented leak alone was worth ~+120 by the time it
          	// was killed. +50 leaves room for legitimately parked
          	// pools while still catching a repeat of that leak
          	// several times over -- each leaked *sql.DB brings its
          	// own connectionOpener goroutine.
          	if growth > 50 {
          		buf := make([]byte, 1<<20)
          		n := runtime.Stack(buf, true)
          		t.Fatalf("LEAK-SMOKE: goroutine count grew by %d (before=%d after=%d) -- full stack dump follows.\n%s",
          			growth, ciLeakSmokeBaseline, after, buf[:n])
          	}
          }
          EOF
          trap 'rm -f internal/agent/zz_ci_leak_smoke_test.go' EXIT
          # No -failfast on purpose: the leak signal this job looks for
          # is cumulative across ALL ~396 tests sharing one process, so
          # an early unrelated failure must not cut the run short.
          # -short matches every other CI run of this package (skips
          # the VCR-cassette TestCoderAgent); -parallel 2 matches the
          # test-agent job's ubuntu leg. No -race: time, not memory, is
          # the constraint that forced batching elsewhere (see the
          # test-race job comment in build.yml), and this job's budget
          # is a single -timeout 30m invocation.
          go test -short -parallel 2 -timeout 30m ./internal/agent/
