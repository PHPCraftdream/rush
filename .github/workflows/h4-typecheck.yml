# TEMPORARY (H4 composed PR repair): print every Go type error of the module
# in one run, linux and windows. See .github/scripts/typecheck/main.go.
# Remove together with that directory when the composed PR is green.
name: h4-typecheck
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/typecheck/**'
      - '.github/workflows/h4-typecheck.yml'

permissions:
  contents: read

concurrency:
  group: h4-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the typecheck tool
        shell: bash
        working-directory: .github/scripts/typecheck
        run: |
          go mod tidy
          go build -o "$RUNNER_TEMP/typecheck" .
      - name: Type-check the whole module
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: '0'
        run: |
          set +e
          "$RUNNER_TEMP/typecheck" -dir . > "$RUNNER_TEMP/typecheck-${{ matrix.goos }}.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/typecheck-${{ matrix.goos }}.txt"
          exit $rc
      - name: Upload errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typecheck-${{ matrix.goos }}
          path: ${{ runner.temp }}/typecheck-${{ matrix.goos }}.txt
