name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Without this, a fast failure on one OS cancels the other legs
      # mid-run via the default fail-fast, hiding whatever they were
      # actually doing.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      # Fork-only guards mirrored from .githooks/pre-push. Run once (ubuntu
      # leg only) — they are pure text/byte checks with no OS-specific
      # behavior, so tripling them across the matrix would only triple the
      # cost, not the coverage. See .githooks/pre-push for the full
      # rationale on why each of these exists; keep both in sync with it.
      - name: internal/db/sql is ASCII-only (sqlc miscounts spans around multi-byte comments)
        if: matrix.os == 'ubuntu-latest'
        # GitHub Actions runs `run:` blocks with no `shell:` key on Linux as
        # `bash --noprofile --norc -eo pipefail {0}` -- NOT plain bash. Under
        # `-e`, `offenders="$(grep -l ... )"; rc=$?` aborts the step the
        # instant grep's command substitution exits non-zero (the clean-tree
        # case, since grep -l with no matches exits 1) -- `rc=$?` is never
        # reached, so the step is red on every clean run and can never
        # distinguish clean from violating. Putting the same command
        # substitution inside an `if` condition sidesteps this: POSIX
        # exempts the commands that make up an if/while/until/&&/||
        # condition from errexit, so `grep`'s exit status only ever reaches
        # `[ -n "$offenders" ]`, never aborts the shell. This mirrors how
        # .githooks/pre-push already spells the same check (that hook runs
        # under plain bash via `bash .githooks/pre-push`, so `-e` never
        # applied there -- but the if-condition form is correct under both).
        run: |
          if offenders="$(grep -lP "[^[:ascii:]]" internal/db/sql/*.sql 2>/dev/null)" && [ -n "$offenders" ]; then
            printf '\033[31mnon-ASCII bytes in:\033[0m\n%s\n' "$offenders"
            echo "::error::a non-ASCII character in a .sql file silently corrupts sqlc codegen -- replace it with an ASCII equivalent"
            exit 1
          fi
      - name: no stale large/small model-slot spelling (renamed to smart/fast)
        if: matrix.os == 'ubuntu-latest'
        run: bash .githooks/check_stale_model_slots.sh
      - name: test files pair db.Connect/db.ConnectRead with db.Release (ref-counted pool contract)
        if: matrix.os == 'ubuntu-latest'
        run: bash .githooks/check_db_release_pairing.sh
      # Regenerate the sqlc output and fail if it drifts from what's
      # committed. Pinned to v1.30.0 — the exact version this repo's own
      # sqlc.yaml targets and whose byte/rune span-counting bug the ASCII
      # guard above exists to route around; a different sqlc version can
      # produce spurious diffs unrelated to any real drift.
      - name: install sqlc (pinned, matches sqlc.yaml / the ASCII guard's target version)
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - name: sqlc generate produces no diff (committed internal/db/*.sql.go matches internal/db/sql/*.sql)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -uo pipefail
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/db/ || {
            echo "::error::internal/db/*.sql.go is stale relative to internal/db/sql/*.sql -- run 'sqlc generate' and commit the result"
            exit 1
          }
      # -short skips VCR/network integration tests (TestCoderAgent) whose
      # cassettes need a Charm hyper key to re-record — unavailable on the
      # fork. No -race (go build -race is gone too, for the same reason).
      #
      # internal/agent (this repo's largest suite, ~396 tests) is excluded
      # here and tested in its own dedicated job below instead -- see that
      # job's comment, and docs/lessons/2026-08-30-ci-goroutine-leak.md,
      # for the full history of why (a chronic SIGTERM kill on
      # ubuntu-latest, plus a genuine Windows OOM from running it
      # concurrently with another package under -p >1).
      - run: go test -short -failfast -p 2 $(go list ./... | grep -v '/internal/agent$')
        shell: bash
      # The generation-fence and process-tree-kill suites are the ones the
      # session/agent concurrency work exists to protect, and -short skips
      # every one of them (they spawn real child processes, so the guard is
      # deliberate). They are also under a !windows build tag. The net effect,
      # found by the 2026-08-20 dynamic release gate and by five static
      # reviews before it, was that these tests ran on NO platform in CI.
      # Run them explicitly on Linux only, without -short and without -race
      # (real fork/exec under -race is slow enough to dominate the job).
      #
      # This pattern covers every test in those suites, including
      # TestProbeThenKillHolder_LiveHolderStillKilled and
      # TestSessionsReset_ForceStillKillsLiveHolder, which used to be excluded
      # here: their helper holder was never reaped, so it lingered as a zombie,
      # kill(pid, 0) kept reporting it alive, and forceKillHolder never saw the
      # exit inside its wait. That was a defect in the test helper, not in the
      # product; it is fixed, and the exclusion is gone with it.
      #
      # .githooks/pre-push runs the same command on non-Windows hosts.
      - name: process-group and lock-fence suites (Linux, no -short)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -failfast -run 'ChildGroup|Registry|WriteChildGroupFile|VerifyGroupStillPlausible|Sweep|ProbeThenKillHolder|AcquireSessionLockForReset|ForceKillHolder|ForceStillKillsLiveHolder' ./internal/session/ ./internal/cmd/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test npm wrapper cache logic (crush, legacy package)
        run: node npm/crush/bin/crush.cache.test.js
      - name: Test npm wrapper cache logic (rush)
        run: node npm/rush/bin/rush.cache.test.js

  # internal/agent gets its own dedicated job, on all three OSes, instead of
  # running as part of the main job's ./... above. Full investigation in
  # docs/lessons/2026-08-30-ci-goroutine-leak.md; summary of why this shape:
  #
  # 1. On ubuntu-latest, `go test ./...` (and later, `go test
  #    ./internal/agent/` even fully isolated in its own job) chronically
  #    died with SIGTERM ("the runner has received a shutdown signal") --
  #    three real bugs were found and fixed at the source (a goroutine leak
  #    from conn.Close() vs db.Release(), an uncached git subprocess spawn
  #    in config.isInsideWorktree(), and a test that left a background
  #    goroutine alive 10s past its own PASS), each confirmed to help, but
  #    the kill itself only fully stopped once this package's own ~396
  #    tests were ALSO split into 4 sequential -run-filtered batches here
  #    (shrinking how much continuous runtime any single invocation needs)
  #    with -parallel 2 (below).
  # 2. On windows-latest, running internal/agent concurrently with another
  #    package (default -p, or even -p 2) produced a genuine "fatal error:
  #    out of memory" (VirtualAlloc failed) -- this package alone is heavy
  #    enough that it needs to not compete with anything else building/
  #    testing at the same time, which a dedicated job guarantees. Even
  #    fully isolated, batch 1/4 alone (99 tests, -parallel 2) still hit
  #    the same failure (errno=1455, ERROR_COMMITMENT_LIMIT -- the paging
  #    file too small, not physical RAM); splitting further to 8/-1
  #    pushed the failure from batch 1 to batch 2, still not clean, so
  #    windows-latest also sets GOMEMLIMIT to make the GC shed heap
  #    proactively instead of asking the OS to commit more (see the step
  #    below for both).
  # 3. -parallel 2 (in-package t.Parallel() concurrency, NOT bounded by -p)
  #    fixed a separate flake class: TestProbe_CheckpointStopDoesNotStallStep
  #    and friends have their own multi-second backstops for a checkpoint
  #    goroutine's sqlite write to observe context cancellation (see
  #    agent_turn.go's stopCheckpoint) -- under enough concurrent disk I/O
  #    from many t.Parallel() tests writing their own sqlite files at once,
  #    a write can genuinely queue behind real contention long enough to
  #    hit that backstop.
  #
  # Test names for the sub-batches are extracted from source at run time
  # (not a hand-maintained list), so a newly added test is automatically
  # covered.
  test-agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test ./internal/agent/ split into sequential batches
        shell: bash
        run: |
          set -uo pipefail
          # No mapfile/readarray: this job now runs on macos-latest too,
          # whose system /bin/bash is 3.2 (Apple ships no newer one) --
          # both builtins require bash 4+. Portable while-read loop works
          # on bash 3.2, bash 4/5, and Windows' Git Bash alike.
          names=()
          while IFS= read -r name; do
            names+=("$name")
          done < <(
            grep -h "^func Test" internal/agent/*_test.go \
              | sed 's/func \(Test[A-Za-z0-9_]*\).*/\1/' \
              | LC_ALL=C sort -u
          )
          total=${#names[@]}
          # windows-latest hit a genuine runtime: VirtualAlloc ... errno=1455
          # (ERROR_COMMITMENT_LIMIT -- the paging file is too small, not
          # physical RAM exhaustion) inside batch 1/4 alone, ~99 tests into a
          # single go test process, at -parallel 2. Halving the batch size
          # roughly halves how much state (sqlite DBs, httptest servers, SSE
          # mock buffers) is ever resident in one process at once, and
          # -parallel 1 removes concurrent-test memory overlap on top of
          # that.
          #
          # ubuntu-latest separately still shows a low residual rate of the
          # external "runner has received a shutdown signal" kill this job
          # exists to avoid (confirmed via ACTIONS_STEP_DEBUG earlier this
          # investigation to be GitHub's own "lost communication with the
          # server ... starves it for CPU/Memory" annotation, i.e. shared-
          # runner noisy-neighbor contention external to this repo's code --
          # all 3 code-level contributors found in this investigation
          # -- see docs/lessons/2026-08-30-ci-goroutine-leak.md -- are
          # already fixed). A probabilistic external kill can't be fixed by
          # any code change, but shortening each batch's continuous runtime
          # shrinks the exposure window per invocation, same reasoning that
          # got ubuntu from chronic to rare in the first place, so ubuntu/
          # macOS move to the same 8-way split too (parallelism unaffected,
          # they never had the Windows-specific memory problem).
          if [ "$RUNNER_OS" = "Windows" ]; then
            batches=8
            parallel=1
            # errno=1455 is ERROR_COMMITMENT_LIMIT -- the OS refused to
            # commit a new heap span because the paging file (not physical
            # RAM) is too small, and it recurred even after the 8/-1 split
            # above (batch 1/8 clean, batch 2/8 still hit it ~86s in).
            # GOMEMLIMIT gives the GC a soft ceiling to actively shed heap
            # against before the runtime ever asks the OS to commit more,
            # attacking the actual mechanism instead of shrinking batches
            # further with diminishing returns.
            export GOMEMLIMIT=1500MiB
          else
            batches=8
            parallel=2
          fi
          size=$(( (total + batches - 1) / batches ))
          status=0
          for ((i = 0; i < batches; i++)); do
            start=$((i * size))
            chunk=("${names[@]:start:size}")
            [ ${#chunk[@]} -eq 0 ] && continue
            pattern="^($(IFS='|'; echo "${chunk[*]}"))$"
            echo "::group::batch $((i + 1))/${batches} (${#chunk[@]} tests)"
            go test -short -failfast -parallel "$parallel" -run "$pattern" ./internal/agent/
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              status=$rc
              break
            fi
          done
          exit $status

  # Targeted -race job. -race was removed entirely earlier this session
  # for CI resource reasons (see the "No -race" note in the build job
  # above), and this session still found and fixed several real
  # goroutine/race bugs purely by manual log analysis -- goroutine-count
  # instrumentation and full stack dumps, see
  # docs/lessons/2026-08-30-ci-goroutine-leak.md -- without the race
  # detector's help, because there was no -race run anywhere left to
  # help. It earned its keep on its first local run: the detector
  # caught a real write/read race between internal/hooks'
  # hardKillAbandoned goroutine (runner.go) and that package's own test
  # stub on the first execution of this exact command.
  #
  # Scope: internal/hooks + internal/session ONLY, on ubuntu-latest
  # ONLY. internal/agent -- the biggest, most concurrency-heavy package
  # -- is deliberately NOT here, and excluding it from the one job
  # whose purpose is catching concurrency bugs needs explaining, so:
  #   1. windows-latest is out of the question for anything -race: this
  #      session established that internal/agent needs GOMEMLIMIT=1500MiB
  #      AND an 8-way batch split on windows-latest to survive WITHOUT
  #      -race (genuine VirtualAlloc errno=1455 ERROR_COMMITMENT_LIMIT
  #      OOM kills -- see the test-agent job's Windows comments), and
  #      -race roughly triples memory use, so it would reintroduce
  #      exactly the OOM eliminated this session. The same history is
  #      the reason not to assume ubuntu's larger headroom transfers
  #      blindly either.
  #   2. Time, not memory, is the measured binding constraint for
  #      internal/agent under -race: a local `go test -race -short
  #      -failfast ./internal/agent/` run this session was killed by
  #      go test's DEFAULT 10-minute per-package timeout ("*** Test
  #      killed: ran too long (11m0s)", package FAIL 668s) on a dev
  #      box -- no OOM, purely runtime. A 4-core shared runner would be
  #      slower still, and one continuous 15-20m invocation is exactly
  #      the per-invocation runtime shape the test-agent job's 8-way
  #      split exists to avoid (the chronic "runner has received a
  #      shutdown signal" kills scale with how long one invocation
  #      runs). The documented fallback -- scope this job down to
  #      internal/hooks and internal/session rather than ship a
  #      permanently red or flaky job -- was taken at first, and the
  #      gap it left is now closed by the batched -run-filtered split
  #      for internal/agent added as this job's second step below:
  #      same technique as the test-agent job, so no single -race
  #      invocation ever spans the whole package.
  #
  # -timeout 15m overrides go test's implicit 10m per-package default:
  # under -race even these two packages run ~2-3x slower (local run:
  # session 76s, hooks 6s), and a run should fail on a real assertion,
  # not on a wall-clock guess against a slower shared runner.
  test-race:
    runs-on: ubuntu-latest
    # Raised from 30m when the internal/agent batched -race split
    # landed below: five batches, each individually -timeout 15m
    # (measured ~2.7m per ~80-test batch locally), plus the
    # hooks/session step and toolchain overhead, expected well under
    # 45m -- 60m is only a runaway backstop, not a target.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race -short -failfast (internal/hooks, internal/session)
        run: go test -race -short -failfast -timeout 15m ./internal/hooks/ ./internal/session/
      # internal/agent -- the most concurrency-heavy package in the repo
      # (generation fences, stream watchdog, mailboxes, coordinator
      # background work) -- gets -race coverage via the batched split
      # whose need the comment above documents: one monolithic
      # `go test -race` over the whole package is killed by go test's
      # default 10m per-package timeout on time alone (668s measured
      # locally, no OOM), so the package is split into 5 sequential
      # -run-filtered batches of ~80 tests using the same
      # source-extraction technique as the test-agent job above (test
      # names are read from *_test.go at run time, so newly added tests
      # are covered automatically; keep the two extractions in sync --
      # the while-read form is deliberate, see that job's bash 3.2
      # comment). Each batch gets -timeout 15m so a real hang fails the
      # batch instead of racing an implicit guess; the measured local
      # cost of one batch under -race (~2.7m for 80 tests) leaves an
      # order of magnitude of headroom on a slower shared runner. Still
      # ubuntu-only: the windows -race OOM history in point 1 above
      # applies unchanged, and macos has never had -race here.
      - name: go test -race -short -failfast (internal/agent, 5 run-filtered batches)
        shell: bash
        run: |
          set -uo pipefail
          names=()
          while IFS= read -r name; do
            names+=("$name")
          done < <(
            grep -h "^func Test" internal/agent/*_test.go \
              | sed 's/func \(Test[A-Za-z0-9_]*\).*/\1/' \
              | LC_ALL=C sort -u
          )
          total=${#names[@]}
          batches=5
          size=$(( (total + batches - 1) / batches ))
          status=0
          for ((i = 0; i < batches; i++)); do
            start=$((i * size))
            chunk=("${names[@]:start:size}")
            [ ${#chunk[@]} -eq 0 ] && continue
            pattern="^($(IFS='|'; echo "${chunk[*]}"))$"
            echo "::group::race batch $((i + 1))/${batches} (${#chunk[@]} tests)"
            go test -race -short -failfast -parallel 2 -timeout 15m -run "$pattern" ./internal/agent/
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              status=$rc
              break
            fi
          done
          exit $status
