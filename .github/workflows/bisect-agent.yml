name: bisect-agent
# Temporary, disposable workflow for binary-searching the chronic
# ubuntu-latest kill in build.yml's go-test step down to a specific
# test/file in internal/agent. workflow_dispatch only -- fired manually
# via `gh workflow run` with a -run/-skip regex, no code commit needed
# per round. Delete this file once the root cause is isolated and fixed.
on:
  workflow_dispatch:
    inputs:
      run_pattern:
        description: "go test -run regex (empty = run everything)"
        required: false
        default: ""
      skip_pattern:
        description: "go test -skip regex (empty = skip nothing)"
        required: false
        default: ""
      label:
        description: "free-text label for this round, shown in the log"
        required: false
        default: "unlabeled"

permissions:
  contents: read

jobs:
  bisect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: run isolated internal/agent subset
        shell: bash
        env:
          RUN_PATTERN: ${{ inputs.run_pattern }}
          SKIP_PATTERN: ${{ inputs.skip_pattern }}
          LABEL: ${{ inputs.label }}
        run: |
          set -uo pipefail
          args=(-short -failfast -v)
          [ -n "$RUN_PATTERN" ] && args+=(-run "$RUN_PATTERN")
          [ -n "$SKIP_PATTERN" ] && args+=(-skip "$SKIP_PATTERN")
          echo "round label: $LABEL"
          echo "go test ${args[*]} ./internal/agent/"
          df -h . 2>/dev/null || true
          go test "${args[@]}" ./internal/agent/
          rc=$?
          echo "round result: rc=$rc"
          exit $rc
