name: nightly

on:
  # Fork: cron disabled. The scheduled run can't be guarded by the job-level
  # `if:` below — GitHub validates the reusable-workflow + secrets contract at
  # startup (before `if`), so the run fails with `startup_failure` and emails on
  # every fire. Manual `workflow_dispatch` stays available; upstream keeps cron.
  # schedule:
  #   - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch: # allows manual triggering

jobs:
  check:
    # Fork: upstream-only — the nightly build needs GoReleaser Pro (GORELEASER_KEY).
    # Skipped on forks, still runs on charmbracelet/crush.
    if: github.repository == 'charmbracelet/crush'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: check
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          if gh run list --workflow nightly.yml -c $(git rev-parse HEAD) -s success | grep 'completed'; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
  nightly:
    needs: check
    if: github.repository == 'charmbracelet/crush' && needs.check.outputs.should_run == 'true'
    uses: charmbracelet/meta/.github/workflows/nightly.yml@main
    secrets:
      goreleaser_key: ${{ secrets.GORELEASER_KEY }}
