# CI shard definitions for the Windows full test suite (Phase 2b shadow).
# Package prefixes are module-relative (module = github.com/PHPCraftdream/rush).
# This file mirrors the named-step grouping of .github/workflows/the former build workflow so
# the failing step's NAME stays the diagnosis. See .github/ci-shards/README.md.
module = "github.com/PHPCraftdream/rush"

# Exact-match only: "internal/agent" itself is isolated in its own
# windows-agent job (see the former build workflow's test-agent job history comments).
# No shard group may list the bare prefix "internal/agent" — assign_shards.py
# rejects that so agent/* subpackages can never be swallowed here.
[agent_isolated]
packages = ["internal/agent"]

[shards.A]
groups = [
  { name = "test: internal/app", type = "go", packages = ["internal/app"], timeout = "20m" },
  { name = "test: sdk", type = "go", packages = ["sdk"] },
  { name = "test: npm wrapper cache logic", type = "npm" },
  { name = "go mod tidy produces no diff", type = "tidy" },
]

[shards.B]
groups = [
  { name = "test: internal/serve/cmd", type = "go", packages = ["internal/serve/cmd"] },
]

[shards.C]
groups = [
  # Prefixes only — tools/mcp and mcp/internal/contextlock are covered by
  # the internal/agent/tools prefix. "internal/agent" itself is NOT here.
  { name = "test: internal/agent subpackages", type = "go", packages = [
    "internal/agent/safety/agentguard",
    "internal/agent/provider/cliprovider",
    "internal/agent/provider/codexprovider",
    "internal/agent/provider/hyper",
    "internal/agent/safety/limitwords",
    "internal/agent/safety/notify",
    "internal/agent/prompt",
    "internal/agent/tools",
  ] },
  { name = "test: internal/kit/sys/shell", type = "go", packages = ["internal/kit/sys/shell"] },
  { name = "test: cmd/batchlab", type = "go", packages = ["cmd/batchlab"] },
  { name = "test: internal/serve/server, internal/session", type = "go", packages = ["internal/serve/server", "internal/session"] },
]

# Shard D keeps the former build workflow's named-step diagnosis for the groups that were
# never promoted to A/B/C, plus the dynamic computed catch-all (same
# philosophy as the former build workflow's last step: a newly added package is always
# covered by SOMETHING).
[shards.D]
groups = [
  { name = "test: internal/agent/safety/permission, internal/config, internal/kit/sync/csync", type = "go", packages = ["internal/agent/safety/permission", "internal/config", "internal/kit/sync/csync"] },
  { name = "test: internal/store/db, internal/store/message, internal/kit/sync/pubsub, internal/store/history", type = "go", packages = ["internal/store/db", "internal/store/message", "internal/kit/sync/pubsub", "internal/store/history"] },
  { name = "test: internal/serve/ops/deploy, internal/serve/ops/update, internal/kit/diag/version", type = "go", packages = ["internal/serve/ops/deploy", "internal/serve/ops/update", "internal/kit/diag/version"] },
  # Dynamic remainder, computed by assign_shards.py. Must stay LAST.
  { name = "test: everything else (computed catch-all)", type = "go", catch_all = true, packages = [] },
]

# Coverage map: every named package/group step in ci-windows-shards.yml maps
# to a shard/group (or special target) that exists in the assignment. The
# workflow is the source of truth; checked by assign_shards.py during planning
# and in shards-summary so workflow group changes cannot silently go uncovered.
[windows_leg]
"test: internal/app" = "A/test: internal/app"
"test: internal/serve/server, internal/session" = "C/test: internal/serve/server, internal/session"
"test: sdk" = "A/test: sdk"
"test: internal/serve/cmd" = "B/test: internal/serve/cmd"
"test: internal/agent subpackages" = "C/test: internal/agent subpackages"
"test: internal/kit/sys/shell" = "C/test: internal/kit/sys/shell"
"test: cmd/batchlab" = "C/test: cmd/batchlab"
"test: internal/agent/safety/permission, internal/config, internal/kit/sync/csync" = "D/test: internal/agent/safety/permission, internal/config, internal/kit/sync/csync"
"test: internal/store/db, internal/store/message, internal/kit/sync/pubsub, internal/store/history" = "D/test: internal/store/db, internal/store/message, internal/kit/sync/pubsub, internal/store/history"
"test: internal/serve/ops/deploy, internal/serve/ops/update, internal/kit/diag/version" = "D/test: internal/serve/ops/deploy, internal/serve/ops/update, internal/kit/diag/version"
"test: everything else (computed catch-all)" = "D/test: everything else (computed catch-all)"
"go mod tidy produces no diff" = "A/go mod tidy produces no diff"
"test: npm wrapper cache logic" = "A/test: npm wrapper cache logic"
"go test ./internal/agent/ split into sequential batches" = "agent"
