name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Without this, a fast failure on one OS (e.g. the macOS bash-3.2
      # incompatibility below) cancels the other legs mid-run via the
      # default fail-fast, hiding whatever they were actually doing --
      # which is exactly what happened investigating the ubuntu-only
      # go-test batching below: ubuntu got canceled mid-batch, never
      # reaching its own pass/fail verdict.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      # Fork-only guards mirrored from .githooks/pre-push. Run once (ubuntu
      # leg only) — they are pure text/byte checks with no OS-specific
      # behavior, so tripling them across the matrix would only triple the
      # cost, not the coverage. See .githooks/pre-push for the full
      # rationale on why each of these exists; keep both in sync with it.
      - name: internal/db/sql is ASCII-only (sqlc miscounts spans around multi-byte comments)
        if: matrix.os == 'ubuntu-latest'
        # GitHub Actions runs `run:` blocks with no `shell:` key on Linux as
        # `bash --noprofile --norc -eo pipefail {0}` -- NOT plain bash. Under
        # `-e`, `offenders="$(grep -l ... )"; rc=$?` aborts the step the
        # instant grep's command substitution exits non-zero (the clean-tree
        # case, since grep -l with no matches exits 1) -- `rc=$?` is never
        # reached, so the step is red on every clean run and can never
        # distinguish clean from violating. Putting the same command
        # substitution inside an `if` condition sidesteps this: POSIX
        # exempts the commands that make up an if/while/until/&&/||
        # condition from errexit, so `grep`'s exit status only ever reaches
        # `[ -n "$offenders" ]`, never aborts the shell. This mirrors how
        # .githooks/pre-push already spells the same check (that hook runs
        # under plain bash via `bash .githooks/pre-push`, so `-e` never
        # applied there -- but the if-condition form is correct under both).
        run: |
          if offenders="$(grep -lP "[^[:ascii:]]" internal/db/sql/*.sql 2>/dev/null)" && [ -n "$offenders" ]; then
            printf '\033[31mnon-ASCII bytes in:\033[0m\n%s\n' "$offenders"
            echo "::error::a non-ASCII character in a .sql file silently corrupts sqlc codegen -- replace it with an ASCII equivalent"
            exit 1
          fi
      - name: no stale large/small model-slot spelling (renamed to smart/fast)
        if: matrix.os == 'ubuntu-latest'
        run: bash .githooks/check_stale_model_slots.sh
      # Regenerate the sqlc output and fail if it drifts from what's
      # committed. Pinned to v1.30.0 — the exact version this repo's own
      # sqlc.yaml targets and whose byte/rune span-counting bug the ASCII
      # guard above exists to route around; a different sqlc version can
      # produce spurious diffs unrelated to any real drift.
      - name: install sqlc (pinned, matches sqlc.yaml / the ASCII guard's target version)
        if: matrix.os == 'ubuntu-latest'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - name: sqlc generate produces no diff (committed internal/db/*.sql.go matches internal/db/sql/*.sql)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -uo pipefail
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/db/ || {
            echo "::error::internal/db/*.sql.go is stale relative to internal/db/sql/*.sql -- run 'sqlc generate' and commit the result"
            exit 1
          }
      # -short skips VCR/network integration tests (TestCoderAgent) whose
      # cassettes need a Charm hyper key to re-record — unavailable on the fork.
      #
      # No -race here (go build -race is gone too, for the same reason).
      #
      # History: this line chronically killed ubuntu-latest with SIGTERM
      # (exit 143, "the runner has received a shutdown signal") for days.
      # Three real, confirmed bugs were found this session and fixed at
      # the source (docs/lessons/2026-08-30-ci-goroutine-leak.md has the
      # first in full detail):
      #   1. Several test helpers closed their pooled internal/db
      #      connection via conn.Close() instead of db.Release(), leaking
      #      a connectionOpener goroutine per test, unboundedly, for the
      #      life of the test binary.
      #   2. config.isInsideWorktree() spawned an uncached `git
      #      rev-parse` subprocess on every single Load()/Init() call
      #      (internal/agent's ~396 tests, most reaching this via
      #      testEnv, each spawning one) -- memoized once per process.
      #   3. A regression test deliberately left a detached background
      #      goroutine (title generation against a hanging mock model)
      #      alive for up to 10 real seconds after the test itself
      #      already reported PASS, overlapping dozens of subsequent
      #      tests' execution -- shrunk to 1s, the minimum the test
      #      actually needs.
      # Each fix was confirmed with real evidence (a temporary
      # runtime.NumGoroutine()/runtime.Stack() diagnostic, and a
      # -p 1 -v run to defeat go test's per-package output buffering)
      # and each measurably improved things. Dropping back to default
      # (unbounded) package parallelism to retest surfaced a 4th,
      # independent confirmation on windows-latest: a genuine "fatal
      # error: out of memory" (VirtualAlloc failed, errno=1455) while
      # compiling/running internal/commands (a tiny, 278-line package
      # with nothing memory-hungry of its own) concurrently alongside
      # this repo's heavier packages -- the exhaustion is from the
      # concurrent total, not any one package. -p 2 fixed that: retried
      # with it, windows-latest and macos-latest both got all the way to
      # their own (already-tracked, known-flaky) test assertions instead
      # of crashing/hanging.
      #
      # ubuntu-latest alone still dies with the same SIGTERM regardless of
      # -p (tried 1 and 2) -- a different failure shape (goroutine count
      # stays flat when it happens, ruling out a leak; the compile+link
      # phase passes cleanly in isolation; the exact test/point it dies at
      # moves every run, further each time a real bug got fixed but never
      # to zero) than the Windows OOM. That "moves further with every
      # unrelated fix, never converges on one culprit" shape is what a
      # cumulative per-JOB resource ceiling on a shared runner looks like,
      # not a specific bug -- internal/agent (~396 tests, by far this
      # repo's largest suite) is carved out into its own job below on
      # ubuntu-latest only, so it gets a fresh VM with nothing already
      # consumed by checkout/setup-go/sqlc/every-other-package's test run
      # first. macos-latest/windows-latest keep testing it as part of
      # ./... below (both are stable there).
      - run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            go test -short -failfast -p 2 $(go list ./... | grep -v '/internal/agent$')
          else
            go test -short -failfast -p 2 ./...
          fi
        shell: bash
      # The generation-fence and process-tree-kill suites are the ones the
      # session/agent concurrency work exists to protect, and -short skips
      # every one of them (they spawn real child processes, so the guard is
      # deliberate). They are also under a !windows build tag. The net effect,
      # found by the 2026-08-20 dynamic release gate and by five static
      # reviews before it, was that these tests ran on NO platform in CI.
      # Run them explicitly on Linux only, without -short and without -race
      # (real fork/exec under -race is slow enough to dominate the job).
      #
      # This pattern covers every test in those suites, including
      # TestProbeThenKillHolder_LiveHolderStillKilled and
      # TestSessionsReset_ForceStillKillsLiveHolder, which used to be excluded
      # here: their helper holder was never reaped, so it lingered as a zombie,
      # kill(pid, 0) kept reporting it alive, and forceKillHolder never saw the
      # exit inside its wait. That was a defect in the test helper, not in the
      # product; it is fixed, and the exclusion is gone with it.
      #
      # .githooks/pre-push runs the same command on non-Windows hosts.
      - name: process-group and lock-fence suites (Linux, no -short)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test -failfast -run 'ChildGroup|Registry|WriteChildGroupFile|VerifyGroupStillPlausible|Sweep|ProbeThenKillHolder|AcquireSessionLockForReset|ForceKillHolder|ForceStillKillsLiveHolder' ./internal/session/ ./internal/cmd/
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Test npm wrapper cache logic (crush, legacy package)
        run: node npm/crush/bin/crush.cache.test.js
      - name: Test npm wrapper cache logic (rush)
        run: node npm/rush/bin/rush.cache.test.js

  # internal/agent carved out of the main ubuntu-latest leg above -- see
  # the comment on that job's go-test step for the full rationale. This
  # job exists ONLY because ubuntu-latest's shared runner couldn't
  # reliably get through this repo's largest test suite (~396 tests)
  # alongside checkout/setup-go/sqlc/every other package in one job; a
  # fresh, otherwise-empty VM gives it the best remaining chance. Not
  # needed on macos-latest/windows-latest (both stable testing this
  # package as part of the main job's ./...), so this job doesn't run a
  # matrix at all.
  #
  # Even alone, in its own job, the single `go test ./internal/agent/`
  # invocation still died with the same SIGTERM -- so the test suite
  # itself (~396 tests, this repo's largest, several minutes of
  # continuous CPU) is further split into 4 sequential sub-batches by
  # test name here. Each batch needs less continuous runtime to finish,
  # shrinking the window during which a burst of shared-runner
  # contention (see the main job's comment -- goroutine count stays flat
  # when this fires, ruling out a leak) could land badly enough to
  # trigger it. Test names are extracted from source at run time (not a
  # hand-maintained list), so a newly added test is automatically
  # covered.
  #
  # -parallel 2: traced a SEPARATE flake pattern (not the SIGTERM above)
  # to its actual mechanism instead of guessing -- widening individual
  # tests' timeouts (tried first) didn't hold, because the delay wasn't
  # in test logic. TestP2_1_SummarizeQueueDrainedFromNonWebPath's
  # "session should become busy after Run starts" failure traces through
  # IsSessionBusy -> mailbox.mu.Lock() -> mb.state and Run ->
  # tryReserveSession -> mailbox.submit() -> mailbox.mu.Lock(): every
  # hop is a plain in-memory mutex on a per-sessionAgent-instance map
  # (agent_control.go, agent_ownership.go, mailbox_ownership.go) --
  # nothing in that path does I/O or can legitimately block for seconds.
  # The only remaining explanation is the spawned goroutine itself not
  # getting scheduled: with default `-parallel` (GOMAXPROCS, 4 on a
  # standard ubuntu-latest runner) and dozens of this batch's 99 tests
  # using t.Parallel() plus REAL (non-fake-clock) 5-30ms tickers
  # (TestStreamWatchdog_*, TestProbe_Checkpoint*), enough of them
  # competing for 4 OS threads at once can genuinely starve a
  # newly-spawned goroutine for multiple seconds. Capping concurrency
  # directly addresses that instead of padding every affected test's
  # own timeout indefinitely.
  test-agent-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: go test ./internal/agent/ split into 4 sequential batches
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t names < <(
            grep -h "^func Test" internal/agent/*_test.go \
              | sed 's/func \(Test[A-Za-z0-9_]*\).*/\1/' \
              | LC_ALL=C sort -u
          )
          total=${#names[@]}
          batches=4
          size=$(( (total + batches - 1) / batches ))
          status=0
          for ((i = 0; i < batches; i++)); do
            start=$((i * size))
            chunk=("${names[@]:start:size}")
            [ ${#chunk[@]} -eq 0 ] && continue
            pattern="^($(IFS='|'; echo "${chunk[*]}"))$"
            echo "::group::batch $((i + 1))/${batches} (${#chunk[@]} tests)"
            go test -short -failfast -parallel 2 -run "$pattern" ./internal/agent/
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              status=$rc
              break
            fi
          done
          exit $status
