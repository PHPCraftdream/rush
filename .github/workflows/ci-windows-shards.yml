# ci-windows-shards — active reusable Windows full-suite workflow.
# Called by ci-tests.yml for full Windows coverage and retained for
# ci-shards-shadow/** validation. Coverage and package assignment are checked
# against .github/ci-shards/shards.toml.
#
# Go module caches use a stable go.sum key; test jobs use rolling Go build
# caches. See the cache steps below for restore/save and main-branch policy.
name: ci-windows-shards

on:
  workflow_call:
  push:
    branches: ["ci-shards-shadow/**"]

permissions:
  contents: read

concurrency:
  group: ci-windows-shards-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fixed convention for the per-group package files and -json logs; each
  # named test step reads its package list from here (keeps this YAML free
  # of package lists — the plan job computes them).
  # Workflow-level env cannot use the runner context; a dot-directory under
  # the workspace is ignored by `go list ./...` and untracked for git diff.
  SHARD_DIR: ${{ github.workspace }}/.ci-shards-tmp/shards
  LOG_DIR: ${{ github.workspace }}/.ci-shards-tmp/logs

jobs:
  # Compute the shard assignment on ubuntu (cheap): every package from
  # `go list ./...` must be assigned exactly once or this job fails — that
  # IS the "not run" assertion for package coverage.
  plan-shards:
    runs-on: ubuntu-latest
    outputs:
      assignment: ${{ steps.plan.outputs.assignment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: resolve Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: list packages and assign shards
        id: plan
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go list ./... > packages.txt
          # Nonzero exit (unassigned / double-assigned / bad prefix) fails the run.
          python3 .github/ci-shards/assign_shards.py \
            --shards .github/ci-shards/shards.toml --input packages.txt > assignment.json
          # Coverage of the active Windows shard groups: the workflow names
          # are checked against [windows_leg] and the resulting assignment.
          python3 .github/ci-shards/assign_shards.py \
            --shards .github/ci-shards/shards.toml \
            --check-coverage --workflow .github/workflows/ci-windows-shards.yml \
            --assignment assignment.json
          # Job outputs must be single-line: emit compact JSON verbatim
          # (json.dump already emits no newlines).
          echo "assignment=$(cat assignment.json)" >> "$GITHUB_OUTPUT"
      - name: save Go module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: upload assignment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-assignment
          path: assignment.json

  windows-shard:
    needs: plan-shards
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [A, B, C, D]
    runs-on: windows-latest
    # Runaway backstop only. Shards A and D usually take 25-40 min; a slow runner
    # took 60 min on shard A (run 41017535293) and the job was cancelled mid-suite.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-go (start timing)
        id: setup_start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: resolve Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ steps.go-cache.outputs.goversion }}-${{ runner.arch }}-windows-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.go-cache.outputs.goversion }}-${{ runner.arch }}-windows-shard-${{ matrix.shard }}-
      - name: record setup-go timing
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          echo "shard-${{ matrix.shard }}|setup-go (includes built-in cache restore)|${{ steps.setup_start.outputs.epoch }}|$(date +%s)" >> "$LOG_DIR/timings.txt"
      - name: Resolve shard groups
        shell: bash
        env:
          ASSIGNMENT: ${{ needs.plan-shards.outputs.assignment }}
        run: |
          set -euo pipefail
          mkdir -p "$SHARD_DIR" "$LOG_DIR"
          python - "$ASSIGNMENT" "${{ matrix.shard }}" "$SHARD_DIR" <<'PY'
          import json, re, sys
          assignment, shard, outdir = json.loads(sys.argv[1]), sys.argv[2], sys.argv[3]
          groups = assignment["shards"][shard]["groups"]
          def slug(name):
              return re.sub(r"[^a-z0-9]+", "-", name.lower()).strip("-")
          with open(f"{outdir}/manifest.txt", "w") as m:
              for g in groups:
                  m.write(slug(g["name"]) + "\n")
                  with open(f"{outdir}/{slug(g['name'])}.txt", "w") as f:
                      f.write("\n".join(g["packages"]))
          print(f"resolved {len(groups)} groups for shard {shard}")
          PY
          cat "$SHARD_DIR/manifest.txt"

      # ---- named group steps (order matches shards.toml) ----
      # Each step: absent/empty group file = genuinely no packages = ok.
      # `set -o pipefail` preserves go test's exit code through tee, and the
      # -json output is captured to $LOG_DIR for the summary job's artifact.

      - name: "test: internal/app"
        if: matrix.shard == 'A'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-app.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -timeout 20m -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-app.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/app|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/server, internal/session"
        if: matrix.shard == 'A'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-server-internal-session.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -timeout 20m -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-server-internal-session.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/server, internal/session|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: sdk"
        if: matrix.shard == 'A'
        shell: bash
        run: |
          f="$SHARD_DIR/test-sdk.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-sdk.json"
          rc=$?
          echo "${{ matrix.shard }}|test: sdk|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: npm wrapper cache logic"
        if: matrix.shard == 'A'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: "test: npm wrapper cache logic"
        if: matrix.shard == 'A'
        shell: bash
        run: |
          t0=$(date +%s)
          node npm/crush/bin/crush.cache.test.js
          node npm/rush/bin/rush.cache.test.js
          echo "${{ matrix.shard }}|test: npm wrapper cache logic|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"

      - name: go mod tidy produces no diff
        if: matrix.shard == 'A'
        shell: bash
        run: |
          t0=$(date +%s)
          go mod tidy
          git diff --exit-code
          echo "${{ matrix.shard }}|go mod tidy produces no diff|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"

      - name: "test: internal/cmd, internal/commands"
        if: matrix.shard == 'B'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-cmd-internal-commands.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-cmd-internal-commands.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/cmd, internal/commands|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/agent subpackages"
        if: matrix.shard == 'C'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-agent-subpackages.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-agent-subpackages.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/agent subpackages|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/shell"
        if: matrix.shard == 'C'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-shell.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-shell.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/shell|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/jobbatch, cmd/batchlab"
        if: matrix.shard == 'C'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-jobbatch-cmd-batchlab.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-jobbatch-cmd-batchlab.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/jobbatch, cmd/batchlab|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/permission, internal/config, internal/csync"
        if: matrix.shard == 'D'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-permission-internal-config-internal-csync.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -timeout 20m -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-permission-internal-config-internal-csync.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/permission, internal/config, internal/csync|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/db, internal/message, internal/queue, internal/pubsub, internal/history"
        if: matrix.shard == 'D'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-db-internal-message-internal-queue-internal-pubsub-internal-history.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-db-internal-message-internal-queue-internal-pubsub-internal-history.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/db, internal/message, internal/queue, internal/pubsub, internal/history|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: internal/oauth, internal/deploy, internal/update, internal/version"
        if: matrix.shard == 'D'
        shell: bash
        run: |
          f="$SHARD_DIR/test-internal-oauth-internal-deploy-internal-update-internal-version.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-internal-oauth-internal-deploy-internal-update-internal-version.json"
          rc=$?
          echo "${{ matrix.shard }}|test: internal/oauth, internal/deploy, internal/update, internal/version|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: "test: everything else (computed catch-all)"
        if: matrix.shard == 'D'
        shell: bash
        run: |
          f="$SHARD_DIR/test-everything-else-computed-catch-all.txt"
          [ -s "$f" ] || exit 0
          set -o pipefail
          t0=$(date +%s)
          go test -short -failfast -p 2 -json $(tr -d '\r' < "$f") 2>&1 | tee "$LOG_DIR/test-everything-else-computed-catch-all.json"
          rc=$?
          echo "${{ matrix.shard }}|test: everything else (computed catch-all)|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
          exit $rc

      - name: check Go build cache contents
        id: go-build-cache-content
        shell: bash
        env:
          GOCACHE: ${{ steps.go-cache.outputs.gocache }}
        run: |
          python -c 'import os; p=os.environ["GOCACHE"]; print("nonempty=" + str(os.path.isdir(p) and any(os.scandir(p))).lower())' >> "$GITHUB_OUTPUT"
      - name: save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true' && steps.go-build-cache-content.outputs.nonempty == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ steps.go-cache.outputs.goversion }}-${{ runner.arch }}-windows-shard-${{ matrix.shard }}-${{ github.sha }}
      - name: upload go test -json logs (even on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-json-shard-${{ matrix.shard }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore

  # internal/agent alone (exact package, NOT subpackages): dedicated job,
  # must not compete with anything else on windows-latest — genuine OOM
  # history (VirtualAlloc errno=1455), see the former build workflow's test-agent job for
  # the full investigation and rationale of batches/parallel/GOMEMLIMIT.
  windows-agent:
    runs-on: windows-latest
    # Runaway backstop only — the Windows branch of the former build workflow's test-agent.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup-go (start timing)
        id: setup_start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: resolve Go cache paths
        id: go-cache
        shell: bash
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "goversion=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ steps.go-cache.outputs.goversion }}-${{ runner.arch }}-windows-agent-${{ github.sha }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.go-cache.outputs.goversion }}-${{ runner.arch }}-windows-agent-
      - name: record setup-go timing
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          echo "agent|setup-go (includes explicit cache restore)|${{ steps.setup_start.outputs.epoch }}|$(date +%s)" >> "$LOG_DIR/timings.txt"
      - name: go test ./internal/agent/ split into sequential batches
        shell: bash
        run: |
          set -uo pipefail
          # Windows branch of the former build workflow's test-agent job (hardcoded here;
          # see that job for the full history — bash 3.2-compatible name
          # extraction, why batches=8/-parallel 1/GOMEMLIMIT=1500MiB).
          names=()
          if ! name_list="$(mktemp)"; then
            echo "::error::could not create a temporary test-name list"
            exit 1
          fi
          cleanup_name_list() { rm -f -- "${name_list:-}" || :; }
          trap cleanup_name_list EXIT
          if ! grep -h -E '^func Test[A-Za-z0-9_]+\(' internal/agent/*_test.go \
            | sed -n -E 's/^func (Test[A-Za-z0-9_]+)\(.*/\1/p' \
            | sed '/^TestMain$/d' \
            | LC_ALL=C sort -u >"$name_list"; then
            echo "::error::failed to extract internal/agent test names"
            exit 1
          fi
          if [ ! -s "$name_list" ]; then
            echo "::error::no internal/agent tests were extracted"
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "$name" ] && names+=("$name")
          done <"$name_list"
          total=${#names[@]}
          [ "$total" -gt 0 ] || { echo "::error::internal/agent test-name list is empty"; exit 1; }
          batches=8
          parallel=1
          # errno=1455 (ERROR_COMMITMENT_LIMIT): GC sheds heap proactively
          # instead of asking the OS to commit more (see the former build workflow).
          export GOMEMLIMIT=1500MiB
          size=$(( (total + batches - 1) / batches ))
          status=0
          for ((i = 0; i < batches; i++)); do
            start=$((i * size))
            chunk=("${names[@]:start:size}")
            [ ${#chunk[@]} -eq 0 ] && continue
            pattern="^($(IFS='|'; echo "${chunk[*]}"))$"
            log="$LOG_DIR/agent-batch-$((i + 1)).json"
            echo "::group::batch $((i + 1))/${batches} (${#chunk[@]} tests)"
            t0=$(date +%s)
            go test -short -failfast -parallel "$parallel" -json -run "$pattern" ./internal/agent/ 2>&1 | tee "$log"
            rc=$?
            echo "::endgroup::"
            echo "agent|agent batch $((i + 1))/${batches}|$t0|$(date +%s)" >> "$LOG_DIR/timings.txt"
            if [ "$rc" -ne 0 ]; then
              status=$rc
              break
            fi
          done
          exit $status
      - name: check Go build cache contents
        id: go-build-cache-content
        shell: bash
        env:
          GOCACHE: ${{ steps.go-cache.outputs.gocache }}
        run: |
          python -c 'import os; p=os.environ["GOCACHE"]; print("nonempty=" + str(os.path.isdir(p) and any(os.scandir(p))).lower())' >> "$GITHUB_OUTPUT"
      - name: save Go module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build-cache.outputs.cache-hit != 'true' && steps.go-build-cache-content.outputs.nonempty == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gocache }}
          key: go-build-${{ runner.os }}-${{ steps.go-cache.outputs.goversion }}-${{ runner.arch }}-windows-agent-${{ github.sha }}
      - name: upload go test -json logs (even on failure)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-json-agent
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore

  # Asserts the "not run" list is ZERO (both directions): every go-list
  # package lands in exactly one shard/agent (re-run of the planner against
  # a fresh `go list`), and every named group in this workflow maps to a
  # live group. Then renders the timing table.
  shards-summary:
    needs: [plan-shards, windows-shard, windows-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: resolve Go cache paths
        id: go-cache
        shell: bash
        run: echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: download test-json artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: assert total coverage (no package left unrun)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go list ./... > packages.txt
          python3 .github/ci-shards/assign_shards.py \
            --shards .github/ci-shards/shards.toml --input packages.txt > recomputed.json
          python3 .github/ci-shards/assign_shards.py \
            --shards .github/ci-shards/shards.toml \
            --check-coverage --workflow .github/workflows/ci-windows-shards.yml \
            --assignment artifacts/shard-assignment/assignment.json
          # The recomputed assignment IS the assignment the jobs ran with
          # (same deterministic input + rules); byte-compare to be sure the
          # shards that just ran covered the full current package list.
          diff <(python3 -c "import json,sys;print(json.dumps(json.load(open('recomputed.json')),sort_keys=True))") \
               <(python3 -c "import json,sys;print(json.dumps(json.load(open('artifacts/shard-assignment/assignment.json')),sort_keys=True))")
      - name: save Go module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.gomodcache }}
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: render timing summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os
          rows = []
          for path in glob.glob("artifacts/*/timings.txt"):
              for line in open(path):
                  parts = line.strip().split("|")
                  if len(parts) == 4:
                      rows.append(parts)
          rows.sort(key=lambda r: int(r[2]))
          print("## ci-windows-shards timing summary\n")
          print("| job/step | step | wall (s) |")
          print("|---|---|---|")
          for job, step, s, e in rows:
              print(f"| {job} | {step} | {int(e) - int(s)} |")
          test_rows = [r for r in rows if r[1].startswith(("test:", "go mod tidy", "agent batch"))]
          if test_rows:
              total = max(int(r[3]) for r in test_rows) - min(int(r[2]) for r in test_rows)
              print(f"\n**Approx total wall (test steps span): {total}s**")
          print("\nCache: setup-go's built-in module+build cache status is only visible")
          print("in each setup-go step log; compare setup-go durations across runs for")
          print("cold-vs-warm restore time (see .github/ci-shards/README.md).")
          PY
