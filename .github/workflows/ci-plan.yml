name: ci-plan

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Unit tests for the selector
        run: python3 -I -m unittest discover -s .github/scripts

      - name: Compute shadow plan
        id: plan
        continue-on-error: true
        run: |
          python3 .github/scripts/ci_plan.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --out plan.json --summary summary.md

      - name: Append summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report selector crash
        if: always() && steps.plan.outcome == 'failure'
        run: |
          echo "⚠️ ci-plan selector crashed (plan content is informational only)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-plan
          path: plan.json
          retention-days: 7
