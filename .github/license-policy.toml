# License policy for the `licenses` CI job (.github/workflows/licenses.yml,
# evaluated by tools/license_check.py).
#
# The project is FSL-1.1-MIT (LICENSE.md): every dependency that ends up in a
# shipped artifact (the Go binary, the embedded web bundle) must be
# permissive, or weak copyleft limited to modified files (MPL-2.0). Strong or
# network copyleft, source-available and non-commercial licenses are not
# compatible. Anything not listed in `allowed` fails the job, including an
# unrecognised or missing license, so a new license is a deliberate edit here.
#
# Changing this file (or tools/license_check.py) changes the dependency
# fingerprint, so the next run re-checks everything.

# SPDX identifiers (the names go-licenses and `pnpm licenses` report).
allowed = [
  "0BSD",
  "Apache-2.0",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Python-2.0",
  "Unlicense",
  "Zlib",
  # The Go patent grant that ships with golang.org/x/* (BSD-3-Clause + PATENTS).
  "LicenseRef-scancode-google-patent-license-golang",
]

# Prefixes that get a dedicated "incompatible" message instead of the generic
# "not in the allowed list". Purely diagnostic: `allowed` alone decides.
incompatible_prefixes = [
  "AGPL",
  "BUSL",
  "CC-BY-NC",
  "CC-BY-SA",
  "CPAL",
  "EUPL",
  "GPL",
  "LGPL",
  "OSL",
  "SSPL",
]

# Reviewed exceptions. `ecosystem` is "go" or "npm"; `name` is a Go package
# path prefix (matched on path-segment boundaries) or an exact npm package
# name; `reason` is mandatory and must say why the license is acceptable.
# Example:
#
# [[exceptions]]
# ecosystem = "go"
# name = "example.com/some/module"
# reason = "dual-licensed; the MIT grant is selected, see upstream LICENSE"
