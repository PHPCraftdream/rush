name: ci-plan

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests for the selector
        run: python3 -I -m unittest discover -s .github/scripts

      - name: Compute shadow plan
        id: plan
        continue-on-error: true
        run: |
          python3 .github/scripts/ci_plan.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --out plan.json --summary summary.md

      - name: Append summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report selector crash
        if: always() && steps.plan.outcome == 'failure'
        run: |
          echo "⚠️ ci-plan selector crashed (plan content is informational only)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: plan.json
          retention-days: 7
