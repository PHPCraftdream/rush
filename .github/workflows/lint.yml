name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fork patch: was `uses: charmbracelet/meta/.github/workflows/lint.yml@main`
  # (a reusable workflow). That call has been failing with startup_failure
  # on every single push since at least 2026-08-25 — 0-1s duration, "This
  # run likely failed because of a workflow file issue" — while the
  # underlying workflow file itself fetches fine over plain HTTP
  # (raw.githubusercontent.com returns 200) and contains nothing this repo
  # can't satisfy (no required secrets, no repo-specific assumptions).
  # That combination — publicly readable content, but Actions refusing to
  # even start the job — matches GitHub's reusable-workflow "Access"
  # setting: a repo can be world-readable for cloning/browsing while still
  # restricting *reusable workflow calls* to repositories within its own
  # organization. charmbracelet/meta is exactly the kind of org-internal
  # tooling repo that setting exists for; a fork under a different account
  # (PHPCraftdream) is not "within the organization" no matter how public
  # the repo's file contents are. Nothing on our side can fix that setting,
  # so this job is now self-contained instead of depending on it — mirrors
  # the golangci-lint invocation .githooks/pre-push already runs locally.
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # By default the Windows runner uses core.autocrlf=true, which
      # rewrites LF to CRLF on checkout and then makes gofmt/gofumpt-backed
      # linters report every line as a formatting violation.
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Keep the pinned version in sync with GOLANGCI_VERSION in
      # .githooks/pre-push.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --config=.golangci.yml --timeout=10m ./...
          version: v2.13
  # internal/db picks its SQLite driver on a GOOS×GOARCH tag pair
  # (connect_modernc.go lists the supported pairs, connect_ncruces.go is
  # the negation). Every runner in the matrix above lands on the modernc
  # side, so the ncruces file was never compiled or linted anywhere —
  # .githooks/pre-push already runs this same pass locally; this job is
  # the CI-side equivalent, since it's the only place that ever looks at
  # that branch.
  lint-ncruces-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint (GOOS=linux GOARCH=mips64)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: linux
          GOARCH: mips64
        with:
          args: --config=.golangci.yml --timeout=10m ./internal/db/...
          version: v2.13
