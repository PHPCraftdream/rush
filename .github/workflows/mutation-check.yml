name: mutation-check

on:
  push:
    branches: ['mut/**']

permissions:
  contents: read

concurrency:
  group: mutation-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
          - { task: R7c, manifest: tools/mutation/R7c.json, i: 1, n: 2 }
          - { task: R7c, manifest: tools/mutation/R7c.json, i: 2, n: 2 }
          - { task: R10c, manifest: tools/mutation/R10c.json, i: 1, n: 2 }
          - { task: R10c, manifest: tools/mutation/R10c.json, i: 2, n: 2 }
          - { task: R11B, manifest: tools/mutation/R11B.json, i: 1, n: 2 }
          - { task: R11B, manifest: tools/mutation/R11B.json, i: 2, n: 2 }
          - { task: R15a, manifest: tools/mutation/R15a.json, i: 1, n: 1 }
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/mutation/*.json
      - name: Record commit SHA
        run: echo "Proved commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Run mutation shard
        run: |
          set -o pipefail
          python -I tools/mutation/run.py \
            --manifest "${{ matrix.shard.manifest }}" \
            --shard "${{ matrix.shard.i }}/${{ matrix.shard.n }}" \
            --root "$GITHUB_WORKSPACE"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-results-${{ matrix.shard.task }}-${{ matrix.shard.i }}
          path: |
            results.json
            tools/mutation-logs/
          if-no-files-found: warn
