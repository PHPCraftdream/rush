version: "2"
linters:
  enable:
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    # - unparam
    - whitespace
    # - wrapcheck
  disable:
    - errcheck
    - ineffassign
    - unused
  settings:
    revive:
      # Exactly one rule: the operator's file-size limit. A non-empty
      # `rules` list REPLACES revive's default rule set (verified against
      # golangci-lint v2.13.1 pkg/golinters/revive: the settings are
      # decoded into a fresh lint.Config and defaults are only re-added
      # for enable-all-rules/enable-default-rules), so enabling revive
      # here adds no other revive rule.
      # skipComments/skipBlankLines must stay false: the count must stay
      # the raw line count that .githooks/check_file_size.sh ratchets on
      # -- that agreement is what makes
      # .githooks/file_size_allowlist.txt the single source of truth for
      # both layers.
      rules:
        - name: file-length-limit
          arguments:
            - max: 1000
              skipComments: false
              skipBlankLines: false
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # interp.ExecHandler is deprecated in favor of interp.ExecHandlers, but
      # the latter always appends interp.DefaultExecHandler as the final
      # handler, which lacks the process-group isolation this fork relies on
      # (see internal/shell/run.go's execHandlerOption doc comment). The
      # deprecated call is intentional. Excluded here instead of via an
      # inline //nolint because staticcheck's SA1019 report for this line is
      # not reproduced consistently across OS runners, which made
      # nolintlint flag the inline directive as "unused" on some platforms.
      - path: internal/shell/run\.go
        linters:
          - staticcheck
        text: "SA1019"
      # file-size ratchet: one entry per .go line of
      # .githooks/file_size_allowlist.txt (the allowlist is the single
      # source of truth; revive only lints Go, so web/src/store.ts lives
      # in the allowlist only). The "# file-size-ratchet" tag on each
      # path line is load-bearing: the selftest enforces the allowlist
      # <-> yml bijection through it, in both directions. Remove both
      # sides together when a file is decomposed.
      - path: '^internal/agent/tools/mcp/state_regression_test\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
      - path: '^internal/agent/agent_turn\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
      - path: '^internal/app/app_run\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
      - path: '^internal/agent/tools/mcp/init_test\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
      - path: '^internal/agent/tools/mcp/lifecycle_findings_test\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
      - path: '^internal/agent/agent_cache_keepalive_test\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
      - path: '^internal/server/p655_rerun_idset_regression_test\.go$' # file-size-ratchet
        linters:
          - revive
        text: 'file-length-limit: file length is'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
