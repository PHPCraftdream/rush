name: waited-identities-probe

on:
  push:
    branches: ['fix/waited-identities-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waited-identities-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            race: '-race'
          - os: windows-latest
            race: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify ordering, late-start reproduction and identity mutant
        env:
          RACE: ${{ matrix.race }}
        run: python -I .github/scripts/verify-waited-identities.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: waited-identities-${{ matrix.os }}
          path: waited-identities-*.jsonl
          if-no-files-found: warn
