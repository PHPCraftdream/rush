# ci — tiered CI entry point.
# Heavy work is selected by the plan and enforced by ci-gate.
name: ci
run-name: ci [${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'full' || github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-ci') && 'full' || 'quick' }}]

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  push:
    branches: [main, 'ci-shadow/**', 'ci-shards-shadow/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'full-ci') && format('isolated-{0}', github.run_id) || ((github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && 'full' || 'quick') }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.read.outputs.mode }}
      ubuntu_needed: ${{ steps.read.outputs.ubuntu_needed }}
      macos_needed: ${{ steps.read.outputs.macos_needed }}
      windows_needed: ${{ steps.read.outputs.windows_needed }}
      linux_packages: ${{ steps.read.outputs.linux_packages }}
      darwin_packages: ${{ steps.read.outputs.darwin_packages }}
      windows_packages: ${{ steps.read.outputs.windows_packages }}
      race_packages: ${{ steps.read.outputs.race_packages }}
      race_needed: ${{ steps.read.outputs.race_needed }}
      agent_selected: ${{ steps.read.outputs.agent_selected }}
      web_changed: ${{ steps.read.outputs.web_changed }}
      security_full: ${{ steps.read.outputs.security_full }}
      security_deps: ${{ steps.read.outputs.security_deps }}
      security_actions: ${{ steps.read.outputs.security_actions }}
      heavy_allowed: ${{ steps.read.outputs.heavy_allowed }}
      native_required: ${{ steps.read.outputs.native_required }}
      validated_head: ${{ steps.read.outputs.validated_head }}
      validated_base: ${{ steps.read.outputs.validated_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: resolve validated base/head
        id: shas
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: choose validation lane
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [ "$FULL_CI" != true ]; then echo cheap_only=true >> "$GITHUB_OUTPUT"; echo force_full=false >> "$GITHUB_OUTPUT"; else echo cheap_only=false >> "$GITHUB_OUTPUT"; fi
          if { [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; } || { [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ] && [ "$FULL_CI" = true ]; }; then echo force_full=true >> "$GITHUB_OUTPUT"; else echo force_full=false >> "$GITHUB_OUTPUT"; fi
      - name: install selector graph dependencies
        if: steps.lane.outputs.cheap_only != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: extract platform graphs
        if: steps.lane.outputs.cheap_only != 'true'
        run: |
          set -euo pipefail; mkdir -p .ci-plan-tmp
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go list -deps -test -json ./... > .ci-plan-tmp/linux.json
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go list -deps -test -json ./... > .ci-plan-tmp/darwin.json
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 go list -deps -test -json ./... > .ci-plan-tmp/windows.json
      - name: select plan and export outputs
        id: read
        env:
          BASE: ${{ steps.shas.outputs.base }}
          HEAD: ${{ steps.shas.outputs.head }}
          FORCE_FULL: ${{ steps.lane.outputs.force_full }}
          CHEAP_ONLY: ${{ steps.lane.outputs.cheap_only }}
        run: |
          set -euo pipefail; mkdir -p .ci-plan-tmp
          if [ "$CHEAP_ONLY" = true ]; then python3 .github/scripts/ci_gate_decide.py minimal-plan --base "$BASE" --head "$HEAD" --output .ci-plan-tmp/plan.json
          else
            python3 .github/scripts/ci_plan.py --base "$BASE" --head "$HEAD" --go-list-json linux=.ci-plan-tmp/linux.json --go-list-json darwin=.ci-plan-tmp/darwin.json --go-list-json windows=.ci-plan-tmp/windows.json --out .ci-plan-tmp/selector-plan.json --summary .ci-plan-tmp/plan.md
            extra=(); if [ "$FORCE_FULL" = true ]; then extra+=(--force-full); fi
            python3 .github/scripts/ci_gate_decide.py prepare-plan --plan .ci-plan-tmp/selector-plan.json --graph-dir .ci-plan-tmp --policy .github/ci-policy.toml --output .ci-plan-tmp/plan.json --base "$BASE" --head "$HEAD" "${extra[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: ci-plan, path: .ci-plan-tmp/plan.json}
  checks:
    needs: plan
    if: always() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: selector, gate, and shard unit tests
        run: |
          python3 -I -m unittest discover -s .github/scripts
          python3 -I -m unittest discover -s .github/ci-shards
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.plan.outputs.heavy_allowed == 'true'
        with: {go-version-file: go.mod}
      - name: internal/db/sql is ASCII-only (sqlc miscounts spans around multi-byte comments)
        if: runner.os == 'Linux'
        run: |
          if offenders="$(grep -lP "[^[:ascii:]]" internal/db/sql/*.sql 2>/dev/null)" && [ -n "$offenders" ]; then
            printf '\033[31mnon-ASCII bytes in:\033[0m\n%s\n' "$offenders"
            echo "::error::a non-ASCII character in a .sql file silently corrupts sqlc codegen -- replace it with an ASCII equivalent"
            exit 1
          fi
      - name: no stale large/small model-slot spelling (renamed to smart/fast)
        if: runner.os == 'Linux'
        run: bash .githooks/check_stale_model_slots.sh
      - name: test files pair db.Connect/db.ConnectRead with db.Release (ref-counted pool contract)
        if: runner.os == 'Linux'
        run: bash .githooks/check_db_release_pairing.sh
      - name: self-test db release pairing guard
        if: runner.os == 'Linux'
        run: bash .githooks/check_db_release_pairing_selftest.sh
      - name: no hand-written source file over 1000 lines (ratchet allowlist)
        if: runner.os == 'Linux'
        run: bash .githooks/check_file_size.sh
      - name: self-test file-size guard
        if: runner.os == 'Linux'
        run: bash .githooks/check_file_size_selftest.sh
      - name: go mod tidy produces no diff
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        run: go mod tidy -diff
      - name: install sqlc (pinned, matches sqlc.yaml / the ASCII guard's target version)
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
      - name: sqlc generate produces no diff (committed internal/db/*.sql.go matches internal/db/sql/*.sql)
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        run: |
          set -uo pipefail
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/db/ || {
            echo "::error::internal/db/*.sql.go is stale relative to internal/db/sql/*.sql -- run 'sqlc generate' and commit the result"
            exit 1
          }
      - name: go build ./...
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        run: go build ./...
      - name: go vet ./...
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        run: go vet ./...
      # the former lint workflow lint matrix, retained on Ubuntu.
      - name: golangci-lint (Ubuntu)
        if: needs.plan.outputs.heavy_allowed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --config=.golangci.yml --timeout=10m ./...
          version: v2.13
      # the former lint workflow `lint-ncruces-driver` job (verbatim): the ncruces SQLite
      # driver branch is compiled on no runner otherwise.
      - name: setup Node for shortcode check
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check model shortcode drift (advisory)
        continue-on-error: true
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        run: |
          go run ./internal/tools/cahsync -check -strict || {
            echo "::warning::Model shortcode catalog lag or refresh failure"
            exit 1
          }
      - name: golangci-lint (GOOS=linux GOARCH=mips64)
        if: runner.os == 'Linux' && needs.plan.outputs.heavy_allowed == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: linux
          GOARCH: mips64
        with:
          args: --config=.golangci.yml --timeout=10m ./internal/db/...
          version: v2.13
  native-lint:
    needs: plan
    if: (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && needs.plan.outputs.heavy_allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - name: golangci-lint (native)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --config=.golangci.yml --timeout=10m ./...
          version: v2.13
  tests:
    needs: [plan, checks]
    if: (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && needs.plan.outputs.heavy_allowed == 'true' && (needs.plan.outputs.ubuntu_needed == 'true' || needs.plan.outputs.macos_needed == 'true' || needs.plan.outputs.windows_needed == 'true' || needs.plan.outputs.agent_selected == 'true' || needs.plan.outputs.race_needed == 'true')
    uses: ./.github/workflows/ci-tests.yml
    permissions: {contents: read}
    with:
      mode: ${{ needs.plan.outputs.mode }}
      linux_packages: ${{ needs.plan.outputs.linux_packages }}
      darwin_packages: ${{ needs.plan.outputs.darwin_packages }}
      windows_packages: ${{ needs.plan.outputs.windows_packages }}
      race_packages: ${{ needs.plan.outputs.race_packages }}
      ubuntu_needed: ${{ needs.plan.outputs.ubuntu_needed == 'true' }}
      macos_needed: ${{ needs.plan.outputs.macos_needed == 'true' }}
      windows_needed: ${{ needs.plan.outputs.windows_needed == 'true' }}
      agent_selected: ${{ needs.plan.outputs.agent_selected == 'true' }}
      race_needed: ${{ needs.plan.outputs.race_needed == 'true' }}
    secrets: inherit
  web:
    needs: plan
    if: (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && needs.plan.outputs.heavy_allowed == 'true' && needs.plan.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Enable pnpm via corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: web
        run: pnpm typecheck
      - name: oxlint
        working-directory: web
        run: pnpm lint
      - name: web unit tests (node --test)
        working-directory: web
        run: node --test src/*.test.ts
      - name: production build (rsbuild build)
        working-directory: web
        run: pnpm build
  ktav-purity:
    needs: plan
    if: (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && needs.plan.outputs.heavy_allowed == 'true'
    uses: ./.github/workflows/ktav-purity.yml
    permissions: {contents: read}
  licenses:
    needs: plan
    if: (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && needs.plan.outputs.heavy_allowed == 'true'
    uses: ./.github/workflows/licenses.yml
    permissions: {contents: read}
  security:
    needs: plan
    if: (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci') && needs.plan.outputs.heavy_allowed == 'true' && (needs.plan.outputs.security_full == 'true' || needs.plan.outputs.security_deps == 'true' || needs.plan.outputs.security_actions == 'true')
    uses: ./.github/workflows/ci-security.yml
    permissions: {actions: read, contents: read, pull-requests: read, security-events: write}
    with:
      security_full: ${{ needs.plan.outputs.security_full == 'true' }}
      security_deps: ${{ needs.plan.outputs.security_deps == 'true' }}
      security_actions: ${{ needs.plan.outputs.security_actions == 'true' }}
    secrets: inherit
  cancel-full-on-unlabel:
    if: github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    permissions: {actions: write, contents: read, pull-requests: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: cancel matching full runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/ci_gate_decide.py cancel-full
  ci-gate:
    needs: [plan, checks, native-lint, tests, web, security, ktav-purity, licenses]
    if: always()
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: download plan artifact
        if: always() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: ci-plan, path: plan}
      - name: download Windows assignment
        if: always() && needs.plan.outputs.mode == 'full' && needs.plan.outputs.windows_needed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: shard-assignment, path: assignment}
      - name: enforce reusable workflow results
        if: always() && needs.plan.outputs.heavy_allowed == 'true'
        env:
          KTAV_RESULT: ${{ needs.ktav-purity.result }}
          LICENSE_RESULT: ${{ needs.licenses.result }}
          NATIVE_LINT_RESULT: ${{ needs.native-lint.result }}
          LINT_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$KTAV_RESULT" != success ] || [ "$LICENSE_RESULT" != success ] || [ "$LINT_RESULT" != success ] || [ "$NATIVE_LINT_RESULT" != success ]; then
            echo 'Required ktav-purity, licenses, or native lint workflow failed or was skipped.' >&2
            exit 1
          fi
      - name: gate live state and receipts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_LABEL: ${{ github.event.label.name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BASE_REF: ${{ github.base_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          VALIDATED_HEAD: ${{ needs.plan.outputs.validated_head }}
          VALIDATED_BASE: ${{ needs.plan.outputs.validated_base }}
          PLAN_OUTPUTS_JSON: ${{ toJSON(needs.plan.outputs) }}
          NEEDS_JSON: '{"plan":"${{ needs.plan.result }}","checks":"${{ needs.checks.result }}","native-lint":"${{ needs.native-lint.result }}","tests":"${{ needs.tests.result }}","web":"${{ needs.web.result }}","security":"${{ needs.security.result }}","ktav-purity":"${{ needs.ktav-purity.result }}","licenses":"${{ needs.licenses.result }}"}'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/ci_gate_decide.py gate --plan plan/plan.json --assignment assignment/assignment.json --output gate-result.json
