# ci-security — REUSABLE workflow (workflow_call ONLY).
#
# Holds the security job bodies sliced out of .github/workflows/security.yml
# so .github/ci.yml (the new tiered entry point) can call them with the
# plan's decisions as inputs. Every action pin, permission set and command
# is copied EXACTLY from security.yml; nothing new is invented here.
#
# Gating (inputs come from the plan job in ci.yml):
#   security_full     — CodeQL go + govulncheck + Grype (full runs)
#   security_deps     — go.mod/go.sum/lockfile changed → govulncheck + Grype
#   security_actions  — .github/workflows/** changed → CodeQL actions
#
# NOT included: actions/dependency-review-action. It is NOT included until
# the repo setting "Dependency review" / the required API access is enabled
# on this fork; security.yml keeps its copy for the legacy path. Revisit at
# cutover.
name: ci-security

on:
  workflow_call:
    inputs:
      security_full:
        description: "Full run: CodeQL go, govulncheck, Grype"
        type: boolean
        default: false
      security_deps:
        description: "Dependency files changed: govulncheck + Grype"
        type: boolean
        default: false
      security_actions:
        description: "Workflow files changed: CodeQL actions"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # security.yml `codeql` matrix leg language=go. Full runs only.
  codeql-go:
    if: inputs.security_full
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: go
      - uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  # security.yml `codeql` matrix leg language=actions. Workflow changes only.
  codeql-actions:
    if: inputs.security_actions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: actions
      - uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  # security.yml `govulncheck` job. Full runs or dependency changes.
  govulncheck:
    if: inputs.security_full || inputs.security_deps
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          govulncheck -C . -format sarif ./... > results.sarif
      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: results.sarif

  # security.yml `grype` job. Full runs or dependency changes.
  grype:
    if: inputs.security_full || inputs.security_deps
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          path: "."
          fail-build: true
          severity-cutoff: critical
      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
