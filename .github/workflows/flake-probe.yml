name: flake-probe

on:
  push:
    branches: ['flake-probe/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            package: ./internal/server
            tests: '^TestHandleRerunMessage_PanicBeforeHandoff(ReleasesReservation|RecreatesPrompt)$'
            race: '-race'
          - os: windows-latest
            package: ./internal/session
            tests: '^TestReleaseGate_P350_QueuedNotExecuted'
            race: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify failure-only diagnostic gates and mutants
        env:
          TEST_PACKAGE: ${{ matrix.package }}
        run: python -I .github/scripts/flake-diagnostic-mutants.py
      - name: Repeat known flaky tests
        env:
          TEST_PACKAGE: ${{ matrix.package }}
          TEST_FILTER: ${{ matrix.tests }}
          RACE: ${{ matrix.race }}
        run: |
          set -o pipefail
          go test $RACE -json -p 1 -parallel 1 -count=100 -timeout=25m -run "$TEST_FILTER" "$TEST_PACKAGE" 2>&1 | tee flake-probe.jsonl
          python -I - <<'PY'
          import json
          from pathlib import Path

          markers = ('panic-window timeline:', 'listener failure report:', '--- pump failure report', '--- pump setup/cleanup failure report')
          for line in Path('flake-probe.jsonl').read_text().splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if any(marker in event.get('Output', '') for marker in markers):
                  raise SystemExit('successful run emitted failure-only diagnostics: ' + event.get('Test', ''))
          PY
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-probe-${{ matrix.os }}
          path: |
            flake-probe.jsonl
            diagnostic-*.log
          if-no-files-found: warn
