name: labeler

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue/PR #"
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  triage:
    # Fork: upstream-only — needs Charm's PERSONAL_ACCESS_TOKEN and labels Charm's
    # issues/PRs. Skipped on forks.
    if: github.repository == 'charmbracelet/crush'
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/labeler.yml
          enable-versioned-regex: 0
          include-title: 1
          include-body: 0
          repo-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          issue-number: ${{ github.event.inputs.issue-number || github.event.issue.number || github.event.pull_request.number }}
