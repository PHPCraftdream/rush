# Job-batches shadow workflow — R12 cutover evidence.
#
# Purpose: run the FULL test suite on the batch runtime, which is the only
# runtime since the H4 atomic activation, and run the AW acceptance tests
# by name. This is intentionally NOT a gate on normal development: it is
# trigger-limited to pushes on ci-shadow/** branches plus manual
# workflow_dispatch, and it MUST NEVER gain a pull_request or schedule/cron
# trigger (hard repository rule — same rule agent-leak-smoke.yml documents).
# Scope note: the shadow workflow is scoped to test evidence, not
# release/lint gates — build.yml's sqlc/fork-guard steps and the npm
# wrapper cache tests are deliberately omitted; the web checks are kept
# (shadow-web job below).

name: job-batches-shadow
on:
  # Repository rule: NO pull_request and NO schedule/cron triggers, ever.
  push:
    branches: ['ci-shadow/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-batches-shadow-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOEXPERIMENT: greenteagc

jobs:
  # Mirrors build.yml's `build` job (build.yml lines 27-281: same 3-OS
  # matrix, same package-group split, same computed catch-all), with these
  # changes:
  #   * Test steps are a keep-going inventory run: every package group
  #     runs under `set +e` (NOT GitHub's default `bash -e -o pipefail`,
  #     which would abort the script on the first red pipeline), and each
  #     group's real exit code is captured via PIPESTATUS[0] and recorded
  #     in a TSV ($RUNNER_TEMP/step-failures.tsv) alongside the tee'd
  #     logs. Every test step exits 0; the final "Collect failure
  #     inventory" step (tools/shadow_failures.py, fed BOTH the logs and
  #     the TSV) alone decides the job's conclusion. -failfast stays off
  #     for the same inventory reason (the run 38586260719 lesson: it
  #     hides all but the first failure per package).
  #   * NO -short anywhere: the shadow suite must run the hermetic batch
  #     acceptance cases that -short skips. The only tests -short
  #     additionally skipped in normal CI are the network/VCR cassette
  #     tests (the TestCoderAgent family), which need a Charm hyper key
  #     unavailable here; instead of -short we exclude exactly those with
  #     `go test -skip 'TestCoderAgent'` (go.mod declares go 1.26.3, which
  #     is >= 1.21, the first release supporting `go test -skip`). Nothing
  #     else is skipped.
  #   * Heavy package runs (internal/app, internal/server+internal/session,
  #     and the catch-all) are serialized with `-p 1 -parallel 1` (instead
  #     of build.yml's -p 2): the batch runtime adds a SQLite writer per
  #     call, so cross-package parallelism is serialized to keep peak
  #     memory and disk contention bounded. Same explicit -timeout 20m
  #     values build.yml uses for those suites.
  #   * GOMEMLIMIT=1500MiB on every test step, matching build.yml's
  #     test-agent job Windows mitigation (VirtualAlloc errno=1455
  #     ERROR_COMMITMENT_LIMIT); it is harmless on Linux/macOS, where the
  #     GC simply never approaches the soft ceiling.
  #   * Every go test invocation tees its output to a per-group log under
  #     RUNNER_TEMP (per-job ephemeral), uploaded as an artifact with
  #     if: always().
  #   * build.yml's ubuntu-only fork-guard steps (sqlc generate drift,
  #     hook self-tests) and the npm wrapper cache tests are omitted —
  #     out of scope for a test-evidence-only shadow suite.
  shadow-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 (build.yml)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.4.0 (build.yml)
        with:
          go-version-file: go.mod
      - name: Isolate global config/data dirs
        shell: bash
        run: |
          echo "RUSH_GLOBAL_DATA=$RUNNER_TEMP/rush-data" >> "$GITHUB_ENV"
          echo "RUSH_GLOBAL_CONFIG=$RUNNER_TEMP/rush-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg-config" >> "$GITHUB_ENV"
      # go mod tidy / git diff --exit-code (build.yml) omitted: release/lint
      # hygiene, not test evidence.
      # ONE keep-going step for all package groups (see the job header):
      # `set +e` so one red group never stops the later groups; real exit
      # codes captured via PIPESTATUS[0] into the TSV the collector reads.
      - name: "test: all package groups (keep going, exit codes collected)"
        id: groups
        shell: bash
        env:
          GOMEMLIMIT: 1500MiB # Windows paging-file OOM mitigation (harmless on Linux/macOS)
        run: |
          # set +e (NOT the default `bash -e -o pipefail`): one red group must
          # NOT stop the later groups — this is an inventory/evidence run.
          # Each group's real exit code is captured via PIPESTATUS[0] (the go
          # test side of the `| tee` pipeline) and recorded in the TSV the
          # collector step reads; this step always exits 0 and the collector
          # alone decides the job's conclusion.
          set +e
          TSV="$RUNNER_TEMP/step-failures.tsv"
          : > "$TSV"
          run_group() {
            name="$1"; logfile="$2"; shift 2
            echo "::group::$name"
            "$@" 2>&1 | tee "$logfile"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              printf '%s\t%d\n' "$name" "$rc" >> "$TSV"
            fi
          }
          run_group "internal/app" "$RUNNER_TEMP/app.log" \
            go test -p 1 -parallel 1 -timeout 20m -skip 'TestCoderAgent' ./internal/app/...
          run_group "internal/server, internal/session" "$RUNNER_TEMP/server-session.log" \
            go test -p 1 -parallel 1 -timeout 20m -skip 'TestCoderAgent' ./internal/server/... ./internal/session/...
          run_group "internal/permission, internal/config, internal/csync" "$RUNNER_TEMP/permission-config-csync.log" \
            go test -p 2 -skip 'TestCoderAgent' ./internal/permission/... ./internal/config/... ./internal/csync/...
          run_group "internal/cmd, internal/commands" "$RUNNER_TEMP/cmd-commands.log" \
            go test -p 2 -skip 'TestCoderAgent' ./internal/cmd/... ./internal/commands/...
          run_group "sdk" "$RUNNER_TEMP/sdk.log" \
            go test -p 2 -skip 'TestCoderAgent' ./sdk/...
          run_group "internal/agent subpackages" "$RUNNER_TEMP/agent-subpackages.log" \
            go test -p 2 -skip 'TestCoderAgent' ./internal/agent/agentguard/... ./internal/agent/cliprovider/... ./internal/agent/hyper/... ./internal/agent/notify/... ./internal/agent/prompt/... ./internal/agent/tools/...
          run_group "internal/db, message, queue, pubsub, history" "$RUNNER_TEMP/db-message-queue-pubsub-history.log" \
            go test -p 2 -skip 'TestCoderAgent' ./internal/db/... ./internal/message/... ./internal/queue/... ./internal/pubsub/... ./internal/history/...
          run_group "internal/oauth, deploy, update, version" "$RUNNER_TEMP/oauth-deploy-update-version.log" \
            go test -p 2 -skip 'TestCoderAgent' ./internal/oauth/... ./internal/deploy/... ./internal/update/... ./internal/version/...
          # Computed catch-all, same philosophy as build.yml: runs every package
          # not explicitly claimed above. Bash 3.2 compatible (macos-latest),
          # no mapfile/readarray.
          covered=(
            github.com/PHPCraftdream/rush/internal/app
            github.com/PHPCraftdream/rush/internal/server
            github.com/PHPCraftdream/rush/internal/session
            github.com/PHPCraftdream/rush/internal/permission
            github.com/PHPCraftdream/rush/internal/config
            github.com/PHPCraftdream/rush/internal/csync
            github.com/PHPCraftdream/rush/internal/cmd
            github.com/PHPCraftdream/rush/internal/commands
            github.com/PHPCraftdream/rush/sdk
            github.com/PHPCraftdream/rush/internal/agent/agentguard
            github.com/PHPCraftdream/rush/internal/agent/cliprovider
            github.com/PHPCraftdream/rush/internal/agent/hyper
            github.com/PHPCraftdream/rush/internal/agent/notify
            github.com/PHPCraftdream/rush/internal/agent/prompt
            github.com/PHPCraftdream/rush/internal/agent/tools
            github.com/PHPCraftdream/rush/internal/agent/tools/mcp
            github.com/PHPCraftdream/rush/internal/db
            github.com/PHPCraftdream/rush/internal/message
            github.com/PHPCraftdream/rush/internal/queue
            github.com/PHPCraftdream/rush/internal/pubsub
            github.com/PHPCraftdream/rush/internal/history
            github.com/PHPCraftdream/rush/internal/oauth
            github.com/PHPCraftdream/rush/internal/oauth/copilot
            github.com/PHPCraftdream/rush/internal/oauth/hyper
            github.com/PHPCraftdream/rush/internal/deploy
            github.com/PHPCraftdream/rush/internal/update
            github.com/PHPCraftdream/rush/internal/version
            github.com/PHPCraftdream/rush/internal/agent
          )
          leftover=()
          while IFS= read -r pkg; do
            found=0
            for c in "${covered[@]}"; do
              [ "$pkg" = "$c" ] && { found=1; break; }
            done
            [ "$found" -eq 0 ] && leftover+=("$pkg")
          done < <(go list ./...)
          echo "leftover packages: ${leftover[*]}"
          echo "::group::catch-all"
          go test -p 1 -parallel 1 -timeout 20m -skip 'TestCoderAgent' "${leftover[@]}" 2>&1 | tee "$RUNNER_TEMP/catch-all.log"
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            printf 'catch-all (leftover packages)\t%d\n' "$rc" >> "$TSV"
          fi
      - name: Collect failure inventory (job stays red on failures)
        if: always()
        shell: bash
        run: |
          set +e
          TSV="$RUNNER_TEMP/step-failures.tsv"
          # If the test step died before creating the TSV (hard crash), that
          # itself is an unparsed failure: synthesize a row so the job is red.
          if [ ! -f "$TSV" ]; then
            printf '(test step did not complete)\t-1\n' > "$TSV"
          fi
          python tools/shadow_failures.py \
            "$RUNNER_TEMP/app.log" \
            "$RUNNER_TEMP/server-session.log" \
            "$RUNNER_TEMP/permission-config-csync.log" \
            "$RUNNER_TEMP/cmd-commands.log" \
            "$RUNNER_TEMP/sdk.log" \
            "$RUNNER_TEMP/agent-subpackages.log" \
            "$RUNNER_TEMP/db-message-queue-pubsub-history.log" \
            "$RUNNER_TEMP/oauth-deploy-update-version.log" \
            "$RUNNER_TEMP/catch-all.log" \
            --step-failures "$TSV" \
            -o "$RUNNER_TEMP/failures.md"
          rc=$?
          # Append BEFORE exiting so a failure inventory still reaches the
          # summary: the parser exits 1 when rows exist, and this deliberate
          # final exit is what keeps the job red (both causes: parsed rows
          # AND unparseable step failures with their exit codes).
          if [ -f "$RUNNER_TEMP/failures.md" ]; then
            cat "$RUNNER_TEMP/failures.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Upload failure inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow-failures-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/failures.md
            ${{ runner.temp }}/failures.txt
          if-no-files-found: ignore
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 (mutation-check.yml)
        with:
          name: shadow-build-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  # Same as build.yml's test-agent job (build.yml lines 283-424): 3-OS
  # matrix, runtime test-name extraction from internal/agent/*_test.go,
  # 8-way sequential batches, -parallel 1 + GOMEMLIMIT=1500MiB on Windows
  # and -parallel 2 elsewhere. Difference: NO -short and
  # `-skip 'TestCoderAgent'` on every invocation (same compensation as the
  # shadow-build job above). NO -failfast, and the batch loop runs under
  # `set +e` with each batch's PIPESTATUS[0] exit code recorded in the TSV:
  # inventory/evidence run for the R12 cutover, not a gate — the full failure
  # list is wanted, so all batches run, the step always exits 0, and the
  # final "Collect failure inventory" step (logs + TSV) decides the job
  # conclusion. The extraction-error guards still exit 1: a structurally
  # broken shard step must be red (the collector runs if: always() anyway).
  shadow-agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 (build.yml)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.4.0 (build.yml)
        with:
          go-version-file: go.mod
      - name: Isolate global config/data dirs
        shell: bash
        run: |
          echo "RUSH_GLOBAL_DATA=$RUNNER_TEMP/rush-data" >> "$GITHUB_ENV"
          echo "RUSH_GLOBAL_CONFIG=$RUNNER_TEMP/rush-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg-config" >> "$GITHUB_ENV"
      - name: go test ./internal/agent/ split into sequential batches
        shell: bash
        run: |
          set -o pipefail
          names=()
          if ! name_list="$(mktemp)"; then
            echo "::error::could not create a temporary test-name list"
            exit 1
          fi
          cleanup_name_list() { rm -f -- "${name_list:-}" || :; }
          trap cleanup_name_list EXIT
          if ! grep -h -E '^func Test[A-Za-z0-9_]+\(' internal/agent/*_test.go \
            | sed -n -E 's/^func (Test[A-Za-z0-9_]+)\(.*/\1/p' \
            | sed '/^TestMain$/d' \
            | LC_ALL=C sort -u >"$name_list"; then
            echo "::error::failed to extract internal/agent test names"
            exit 1
          fi
          if [ ! -s "$name_list" ]; then
            echo "::error::no internal/agent tests were extracted"
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "$name" ] && names+=("$name")
          done <"$name_list"
          total=${#names[@]}
          if [ "$total" -eq 0 ]; then
            echo "::error::internal/agent test-name list is empty"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            batches=8
            parallel=1
            export GOMEMLIMIT=1500MiB
          else
            batches=8
            parallel=2
          fi
          size=$(( (total + batches - 1) / batches ))
          : > "$RUNNER_TEMP/shadow-agent.log"
          : > "$RUNNER_TEMP/step-failures.tsv"
          # set +e (NOT GitHub's default `bash -e -o pipefail`): an unguarded
          # failing pipeline would abort the script before its exit code could
          # be recorded — all 8 batches must always run; the TSV + collector
          # decide redness.
          set +e
          for ((i = 0; i < batches; i++)); do
            start=$((i * size))
            chunk=("${names[@]:start:size}")
            [ ${#chunk[@]} -eq 0 ] && continue
            pattern="^($(IFS='|'; echo "${chunk[*]}"))$"
            echo "::group::batch $((i + 1))/${batches} (${#chunk[@]} tests)"
            go test -parallel "$parallel" -skip 'TestCoderAgent' -run "$pattern" ./internal/agent/ 2>&1 | tee -a "$RUNNER_TEMP/shadow-agent.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              printf 'internal/agent batch %d/%d\t%d\n' "$((i + 1))" "$batches" "$rc" >> "$RUNNER_TEMP/step-failures.tsv"
            fi
          done
          # This step always exits 0; the TSV + collector decide redness.
          exit 0
      - name: Collect failure inventory (job stays red on failures)
        if: always()
        shell: bash
        run: |
          set +e
          TSV="$RUNNER_TEMP/step-failures.tsv"
          # If the test step died before creating the TSV (hard crash), that
          # itself is an unparsed failure: synthesize a row so the job is red.
          if [ ! -f "$TSV" ]; then
            printf '(test step did not complete)\t-1\n' > "$TSV"
          fi
          python tools/shadow_failures.py "$RUNNER_TEMP/shadow-agent.log" \
            --step-failures "$TSV" \
            -o "$RUNNER_TEMP/failures.md"
          rc=$?
          # Append BEFORE exiting so a failure inventory still reaches the
          # summary: the parser exits 1 when rows exist, and this deliberate
          # final exit is what keeps the job red (both causes: parsed rows
          # AND unparseable step failures with their exit codes).
          if [ -f "$RUNNER_TEMP/failures.md" ]; then
            cat "$RUNNER_TEMP/failures.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Upload failure inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow-failures-agent-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/failures.md
            ${{ runner.temp }}/failures.txt
          if-no-files-found: ignore
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 (mutation-check.yml)
        with:
          name: shadow-agent-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  # AW acceptance: the product has a single (batch) runtime. The selector
  # below REQUIREs its tests to exist and run: zero matches ("no tests to
  # run"), a SKIP, or any failure all turn the job red with an explicit
  # error, and every named AWa/AWb test must have passed by name.
  shadow-aw-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 (build.yml)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.4.0 (build.yml)
        with:
          go-version-file: go.mod
      - name: Isolate global config/data dirs
        shell: bash
        run: |
          echo "RUSH_GLOBAL_DATA=$RUNNER_TEMP/rush-data" >> "$GITHUB_ENV"
          echo "RUSH_GLOBAL_CONFIG=$RUNNER_TEMP/rush-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg-config" >> "$GITHUB_ENV"
      - name: AW acceptance (selection + by-name proof)
        shell: bash
        run: |
          set -o pipefail
          # Every required test must have run and passed BY NAME: a renamed or
          # deleted test cannot hide behind another passing test, and an empty
          # selection ("no tests to run") or a SKIP is a failure.
          require_passed() {
            logfile="$1"
            shift
            if grep -q 'no tests to run' "$logfile"; then
              echo "::error::selector matched zero tests in $logfile"
              exit 1
            fi
            if grep -q -- '--- SKIP' "$logfile"; then
              echo "::error::a selected test reported SKIP in $logfile - the acceptance must actually run"
              exit 1
            fi
            for name in "$@"; do
              if ! grep -q -- "--- PASS: $name " "$logfile"; then
                echo "::error::required test $name did not run and pass (renamed, deleted or failing) - see $logfile"
                exit 1
              fi
            done
          }
          AW_TESTS="TestAWa1ChildSettlementNoWakeNoDebt TestAWa2RootSettlementUnblocksWorkerDeliveryStillHeld TestAWa3TopLevelAnyWakesOnlyOnRootDebt TestAWa4AllStaysAsleepWhileOtherRootLive TestAWa5ChildQuestionBreaksSleepQuestionStillPending TestAWa5AgentChildAnswerViaRunnerInject TestAWbStopAdmissionFourBAndDelivery TestAWbDebtFreeVariant"
          go test -p 1 -parallel 1 -count=1 -v \
            -run '^(TestAWa|TestAWb)' \
            ./internal/agent/ 2>&1 | tee "$RUNNER_TEMP/aw-acceptance.log"
          rc=${PIPESTATUS[0]}
          require_passed "$RUNNER_TEMP/aw-acceptance.log" $AW_TESTS
          if [ "$rc" -ne 0 ]; then
            echo "::error::acceptance run failed (rc=$rc)"
            exit 1
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 (mutation-check.yml)
        with:
          name: shadow-aw-acceptance-logs
          path: ${{ runner.temp }}/aw-acceptance-*.log
          if-no-files-found: ignore

  # Mirrors lint.yml's lint-web job (lint.yml lines 86-110), plus the same
  # configuration isolation / log capture / artifact pattern the Go jobs in
  # this file use (unique dir names so they never collide with another
  # job's isolated dirs under the same runner temp; artifact name unique
  # across all jobs here).
  shadow-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2 (build.yml/lint.yml)
        with:
          persist-credentials: false
      - name: Isolate global config/data dirs
        shell: bash
        run: |
          echo "RUSH_GLOBAL_DATA=$RUNNER_TEMP/web-rush-data" >> "$GITHUB_ENV"
          echo "RUSH_GLOBAL_CONFIG=$RUNNER_TEMP/web-rush-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/web-xdg-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/web-xdg-config" >> "$GITHUB_ENV"
      - name: Enable pnpm via corepack
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.4.0 (build.yml/lint.yml)
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        # shell: bash = bash -eo pipefail, so a failing command is not masked by tee.
        shell: bash
        run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/web-install.log"
      - name: tsc --noEmit
        working-directory: web
        # shell: bash = bash -eo pipefail, so a failing command is not masked by tee.
        shell: bash
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/web-typecheck.log"
      - name: oxlint
        working-directory: web
        # shell: bash = bash -eo pipefail, so a failing command is not masked by tee.
        shell: bash
        run: pnpm lint 2>&1 | tee "$RUNNER_TEMP/web-lint.log"
      - name: web unit tests (node --test)
        working-directory: web
        # shell: bash = bash -eo pipefail, so a failing command is not masked by tee.
        shell: bash
        run: node --test src/*.test.ts 2>&1 | tee "$RUNNER_TEMP/web-unittest.log"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 (mutation-check.yml)
        with:
          name: shadow-web-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
